[project]
name = "ess-thesis"
version = "0.2.0"
description = "ESS bidding: Baldick's SOC-based market design vs. conventional (current-design) curves under forecast error -- experiments.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
viz = ["matplotlib>=3.7"]
notebook = ["jupyter>=1.0", "ipykernel>=6.29"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
