<style>
/* Layout: one-screen app. Top bar (name, search, folder filters) over a two-pane body:
   the network on the left, the open note on the right; stacked on phones. */
:root {
  --bg: #F6F7FB; --surface: #FFFFFF; --fg: #161A2B; --muted: #5B6178; --line: #DDE1EC;
  --edge: #C3C8D8; --edge-hot: #2F3EEA; --accent: #2F3EEA; --accent-soft: #E6E8FD; --label: #2A2F45;
  --f-home: #161A2B; --f-research: #2F3EEA; --f-market: #C8501A; --f-model: #3F4A9E; --f-results: #1B7F47;
  --f-computation: #7A4CC2; --f-experiments: #A67C00; --f-verification: #0F7A60; --f-examples: #C2417D;
  --f-literature: #6B7280; --f-people: #0B8794; --f-deliverables: #8B5E3C; --f-ideas: #D97706;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --serif: "IBM Plex Serif", Georgia, serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1220; --surface: #161A2C; --fg: #E7E9F3; --muted: #9AA0B8; --line: #2A2F47;
  --edge: #343A57; --edge-hot: #8E98FF; --accent: #8E98FF; --accent-soft: #232A52; --label: #D5D8E8;
  --f-home: #F2F3FA; --f-research: #8E98FF; --f-market: #FF9A66; --f-model: #A7B0FF; --f-results: #5BD08F;
  --f-computation: #C29BFF; --f-experiments: #F2C94C; --f-verification: #43D1A8; --f-examples: #FF8DC0;
  --f-literature: #A3A9BC; --f-people: #4FD3E0; --f-deliverables: #D9A97E; --f-ideas: #FFB547;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0F1220; --surface: #161A2C; --fg: #E7E9F3; --muted: #9AA0B8; --line: #2A2F47;
  --edge: #343A57; --edge-hot: #8E98FF; --accent: #8E98FF; --accent-soft: #232A52; --label: #D5D8E8;
  --f-home: #F2F3FA; --f-research: #8E98FF; --f-market: #FF9A66; --f-model: #A7B0FF; --f-results: #5BD08F;
  --f-computation: #C29BFF; --f-experiments: #F2C94C; --f-verification: #43D1A8; --f-examples: #FF8DC0;
  --f-literature: #A3A9BC; --f-people: #4FD3E0; --f-deliverables: #D9A97E; --f-ideas: #FFB547;
  color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--surface); }
.brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.brand h1 { margin: 0; font-family: var(--serif); font-weight: 600; font-size: 19px; letter-spacing: 0.01em; }
.brand span { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.search { position: relative; flex: 1 1 260px; max-width: 420px; }
.search input { width: 100%; box-sizing: border-box; font: inherit; font-size: 14px; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
.search input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.results { position: absolute; z-index: 20; top: calc(100% + 4px); left: 0; right: 0; background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; max-height: 320px; overflow: auto; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
.results button { display: flex; width: 100%; gap: 10px; align-items: center; text-align: left; font: inherit; font-size: 14px;
  color: var(--fg); background: none; border: 0; padding: 8px 12px; cursor: pointer; }
.results button[aria-selected="true"], .results button:hover { background: var(--accent-soft); }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 12.5px; color: var(--fg);
  background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; cursor: pointer; }
.chip[aria-pressed="false"] { opacity: .45; }
.chip:focus-visible, .tool:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.chip .n { font-family: var(--mono); font-size: 11px; color: var(--muted); }
main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 440px); min-height: 0; }
.graph { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
.graph svg { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
.graph svg:active { cursor: grabbing; }
.tools { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
.tool { font: inherit; font-size: 12.5px; color: var(--fg); background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 10px; cursor: pointer; }
.tool[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.forces { position: absolute; left: 12px; bottom: 54px; z-index: 5; width: min(260px, calc(100% - 24px)); background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px 12px; box-shadow: 0 8px 24px rgba(0,0,0,.14); }
.forces h2 { margin: 0 0 6px; font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.forces label { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-size: 12.5px; margin-top: 8px; }
.forces label output { font-family: var(--mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.forces input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 2px 0 0; }
.forces .row { display: flex; justify-content: flex-end; margin-top: 10px; }
.hint { position: absolute; right: 12px; bottom: 12px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.link { stroke: var(--edge); stroke-width: 1; }
.link.hot { stroke: var(--edge-hot); stroke-width: 1.8; }
.node circle { stroke: var(--surface); stroke-width: 1.5; cursor: pointer; }
.node.sel circle { stroke: var(--fg); stroke-width: 2.5; }
.node text { font-family: var(--sans); font-size: 11px; fill: var(--label); pointer-events: none; paint-order: stroke;
  stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round; }
.dim { opacity: .12; }
aside { border-left: 1px solid var(--line); background: var(--surface); min-height: 0; overflow: auto; }
.note { padding-block: 18px 40px; padding-left: 22px; padding-right: max(22px, env(safe-area-inset-right, 0px)); }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.meta .folder { display: inline-flex; align-items: center; gap: 6px; }
.nav { display: flex; gap: 6px; margin-bottom: 10px; }
.note h1 { font-family: var(--serif); font-weight: 600; font-size: 23px; line-height: 1.25; margin: 10px 0 12px; text-wrap: balance; }
.note h2 { font-family: var(--serif); font-weight: 600; font-size: 17px; margin: 22px 0 8px; }
.note p, .note li { line-height: 1.6; }
.note ul, .note ol { padding-left: 20px; }
.note a.wl { color: var(--accent); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); cursor: pointer; }
.note a.wl:hover { border-bottom-color: var(--accent); }
.note a.wl:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.note code { font-family: var(--mono); font-size: 13px; background: var(--bg); padding: 1px 5px; border-radius: 4px; }
.tablewrap { overflow-x: auto; margin: 12px 0; }
.note table { border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; min-width: 100%; }
.note th, .note td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
.note th { font-weight: 600; color: var(--muted); font-size: 12.5px; }
.backlinks { margin-top: 26px; border-top: 1px solid var(--line); padding-top: 14px; }
.backlinks h3 { margin: 0 0 8px; font-size: 12px; font-family: var(--mono); font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.backlinks div { display: flex; flex-wrap: wrap; gap: 6px; }
.backlinks button { font: inherit; font-size: 12.5px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; cursor: pointer; text-align: left; }
.mjx-display, mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
mjx-container { color: var(--fg); }

.note figure { margin: 14px 0 18px; }
.note figure button.zoom { display: block; width: 100%; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: #FFFFFF; cursor: zoom-in; overflow: hidden; }
.note figure img { display: block; width: 100%; height: auto; }
.note figcaption { font-size: 12.5px; color: var(--muted); margin-top: 6px; line-height: 1.45; }
.note a.pdf { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--fg); background: var(--bg); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 10px; margin: 2px 0; font-size: 13.5px; line-height: 1.35; }
.note a.pdf:hover { border-color: var(--accent); }
.note a.pdf:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.note a.pdf .tag { font-family: var(--mono); font-size: 10.5px; font-weight: 500; letter-spacing: .05em; color: var(--surface); background: var(--accent); border-radius: 4px; padding: 1px 5px; }
.note a.pdf .tag { white-space: nowrap; flex: none; }
.note ul:has(> li > a.pdf) { list-style: none; padding-left: 0; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.note ul.files { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.modal { position: fixed; inset: 0; z-index: 50; background: color-mix(in srgb, var(--bg) 70%, rgba(0,0,0,.6)); display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.modal .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-block: 10px; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.modal .bar strong { font-family: var(--serif); font-size: 15px; margin-right: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.modal .bar .pg { font-family: var(--mono); font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.modal .bar input { width: 3.5em; font: inherit; font-size: 13px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
.modal .view { flex: 1; overflow: auto; display: flex; justify-content: center; align-items: flex-start; padding: 16px; }
.modal .view canvas, .modal .view img { background: #FFFFFF; box-shadow: 0 6px 24px rgba(0,0,0,.25); max-width: none; }
.modal .view img { max-width: 100%; height: auto; }
.modal .msg { color: var(--fg); font-size: 14px; padding: 24px; max-width: 60ch; }
@media (max-width: 760px) {
  html, body { height: auto; }
  .app { height: auto; display: block; }
  main { display: block; }
  .graph { height: 58vh; border-bottom: 1px solid var(--line); }
  aside { border-left: 0; overflow: visible; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<script type="application/json" id="data">{"nodes": [{"id": "Home", "folder": "Home", "type": "map", "tags": ["map"], "aliases": [], "body": "# Thesis knowledge map\n\n**Equivalent interval bids for energy storage** — can today's day-ahead bids reproduce Baldick's state-of-charge (SOC) market, what must a battery know to do it, and what does imperfect information cost?\n\n## The storyline in one line\n[[Current design]] vs [[Baldick SOC-based design]] → both are LPs, compare their [[KKT conditions]] → [[Equivalent bids]] → the bids need [[Value of stored energy (pi)]] and [[Limit multipliers (nu)]] → the owner gets them from its own [[Self-schedule problem]] ([[Thm 6.3 Bids from technical data and prices]]) → replace true prices by a forecast → measure the [[Welfare loss metric]] in the [[Experimental pipeline]].\n\n## Research questions\n- [[Motivation]] — why it matters now\n- [[RQ1 Equivalence]] — answered\n- [[RQ2 Information]] — answered\n- [[RQ3 Cost of imperfect information]] — stage 0 passed in the repo; stage 1 (two batteries) waiting on [[Open decisions for the supervisors]]\n- [[RQ4 Use by the operator]] — extension\n- See also [[Research gap]], [[Contributions]], [[Hypotheses]], [[Timeline and milestones]]\n\n## Where to start\n| If you want… | Open |\n|---|---|\n| the two market designs | [[Current design]], [[Baldick SOC-based design]] |\n| the key quantities | [[Value of stored energy (pi)]], [[Price thresholds]] |\n| the main results | [[Prop 5.1 KKT equivalence]], [[Thm 6.3 Bids from technical data and prices]] |\n| why the reform is not free | [[Computational burden]], [[Why not adopt Baldick directly]] |\n| the experiments | [[Experimental pipeline]], [[Stage 0 results]], [[Stage 1]] |\n| what is still to decide | [[Open decisions for the supervisors]] |\n| forecast errors | [[Synthetic forecast error model]], [[Terminal-value error]], [[Renewable-driven forecast error]] |\n| how to read the results | [[Regime analysis]], [[Common random numbers]] |\n| the code | [[Code base]] |\n| the examples | [[Baldick base case]], [[Stage 1 two-battery case]], [[Five-hour segment example]] |\n| what is written where | [[Thesis report]] (ch. 9–10 for the experiments), [[Model structure document]], [[Defense presentation]], [[Poster (PES template)]] |\n\n## Folders\nResearch · Market designs · Model · Results · Computation · Experiments · Examples · Literature · People · Deliverables · Ideas\n\n## Figures and sources\n\n![[fig_logic.png]]\n*Logic of the thesis (report Figure 1.1)*\n\n- [[thesis_report.pdf|Thesis report (full PDF)]]\n- [[ESS_thesis_defense.pdf|Defense presentation (PDF)]]\n- [[ESS_lecture_notes.pdf|Lecture notes deck (PDF)]]\n- [[forecast_error_models_note.pdf|Forecast error note (PDF)]]\n- [[ESS_poster_PES.pdf|Poster, PES template (PDF)]]\n- [[model_structure.pdf|Model structure document (PDF)]]\n- [[stage_1_structure.pdf|Stage 1 structure document (PDF)]]"}, {"id": "RQ1 Equivalence", "folder": "Research", "type": "question", "tags": ["rq", "answered"], "aliases": [], "body": "**Question.** Do there exist charging bids and discharging offers in the [[Current design]] such that its clearing outcome (dispatch and nodal prices) coincides with that of the [[Baldick SOC-based design]]? Under which conditions?\n\n**Answer: yes, exactly.** Bid and offer at Baldick's [[Price thresholds]] every hour, with blocks at full power: the [[Equivalent bids]]. Proof by comparing the two [[KKT conditions]] systems ([[Prop 5.1 KKT equivalence]]). Holds with a DC network, ramps, elastic demand and any number of batteries.\n\nRelated results\n- [[Prop 5.2 Lagrangian relaxation]] — the current design is a Lagrangian relaxation of Baldick's w.r.t. the SOC rows.\n- [[Prop 5.3 Stepped bids]] — general stepped bids are equivalent iff Baldick's schedule lies on the bid curves at Baldick's prices.\n- [[Remark 5.6 Quantity indeterminacy]] — prices are not the whole story.\n\nStatus: answered (report ch. 5). Feeds [[RQ2 Information]].\n\n## Figures and sources\n\n![[slide_18.jpg]]\n*Defense slide 18: equivalent bids*\n\n- [[thesis_report.pdf#page=36|Report ch. 5 — Equivalence]]"}, {"id": "RQ2 Information", "folder": "Research", "type": "question", "tags": ["rq", "answered"], "aliases": [], "body": "**Question.** What information must the [[Equivalent bids]] embed? Which part is private to the owner and which part is endogenous to the market? Can the owner build them without the solution of Baldick's market?\n\n**Answer.** The bids depend on the instance only through the battery's own [[Battery parameters (theta)]] and the prices at its own bus.\n- The owner solves its own [[Self-schedule problem]] and reads **any** optimal dual → [[Thm 6.3 Bids from technical data and prices]].\n- Works for any number of batteries, each alone → [[Cor 6.15 Several ESS]].\n- All equivalent bids form a polyhedron → [[Prop 6.5 Polyhedron of equivalent bids]]; prices pin the bids except where an SOC limit is reached → [[Cor 6.6 When prices pin pi]] and the [[Pre-limit selection rule]].\n- Closed form: [[Cor 6.8 Max-min closed form]], [[Segments and marginal intervals]], [[Prop 6.13 Value of stored energy from prices]], [[Cor 6.14 Bids as functions of prices]].\n- If no SOC limit binds, technical data suffice → [[Cor 5.5 Technical-data-only bids]]; in an SOC-enforcing current design they are always exact → [[Remark 5.8 SOC-enforcing current design]].\n\nThe gap between the designs is an **information gap: price forecasts**. Leads to [[RQ3 Cost of imperfect information]].\n\n## Figures and sources\n\n![[slide_27.jpg]]\n*Defense slide 27: answer to RQ2*\n\n- [[thesis_report.pdf#page=41|Report ch. 6 — Bids from technical data and prices]]"}, {"id": "RQ3 Cost of imperfect information", "folder": "Research", "type": "question", "tags": ["rq", "in-progress"], "aliases": [], "body": "**Question.** How large is the welfare loss of the [[Current design]] when storage bids are built from imperfect price forecasts or from technical data only, and which properties of the error (size, persistence, bias, common share) drive it?\n\n**Method.** [[Experimental pipeline]] with the [[Bid families]], the [[Synthetic forecast error model]] (and, with several owners, the [[Terminal-value error]]), [[Real-time evaluation and premium psi]] and the [[Welfare loss metric]]. Results read through [[Regime analysis]] and [[Common random numbers]].\n\n**Where it stands (repo, Nov 2026).**\n- [[Stage 0 results]] on the [[Baldick base case]], one battery: the gate passes ($\\mathcal B^\\star$ loses 0). Perfect prices with the battery's own plan lose 1.30% of the storage value; any forecast error raises it to about 6%, and it grows to 7.9% at σ = 20 \\$/MWh. Technical-data-only bids lose 0 / 3.1 / 15.4% at ψ = 0 / 10 / 50.\n- [[Stage 1]] (two batteries on the same system): at zero error the two owners' bids **cross** and trade with each other, 38% of V lost ([[Bids cross between batteries]]). This must be fixed in the [[Quantity rule]] before the error grid means anything.\n\nNext: [[Open decisions for the supervisors]], then [[Stage 1]], [[Stage 2]], [[Stage 3]].\n\n## Figures and sources\n\n- [[thesis_report.pdf#page=57|Report ch. 9 — Experimental design]]\n- [[thesis_report.pdf#page=66|Report ch. 10 — First experiments]]"}, {"id": "RQ4 Use by the operator", "folder": "Research", "type": "question", "tags": ["rq", "extension"], "aliases": [], "body": "**Question (extension).** Can the operator (ISO) use the same construction with its own price forecast to obtain a competitive reference bid for each battery, and does it separate competitive from strategic bids?\n\n**Idea.** Evaluate the equivalent-bid map $\\Phi_e(\\theta_e,\\hat\\lambda^{ISO})$ with the ISO's forecast → an SOC-consistent reference with a natural tolerance band. Compare with [[CAISO default energy bids]]. Origin: [[Jalal Kazempour]]'s link to CAISO's RUC-type idea ([[ISO reference bids for market monitoring]]).\n\nStatus: proposed; decision gate G3 in Jan 2027 ([[Timeline and milestones]]). On the poster this appears as RQ3 (poster numbering differs).\n\n## Figures and sources\n\n- [[thesis_report.pdf#page=49|Report §6.7 — Who can compute the bids]]\n- [[thesis_report.pdf#page=75|Report §11.3 — Next steps]]"}, {"id": "Research gap", "folder": "Research", "type": "concept", "tags": ["research"], "aliases": [], "body": "The literature has (i) designs that bring the SOC into the clearing ([[Baldick SOC-based design]], [[Zheng et al. 2023 SOC market model]], [[Chen and Tong 2022 SOC-dependent bids]]), (ii) methods for an owner to bid under price uncertainty ([[Xu et al. 2018 cycle aging]]), and (iii) heuristic monitoring references ([[CAISO default energy bids]], [[Qi and Xu 2025 bid bounds]]).\n\n**Missing:** an exact link between the two main designs — the interval bids that reproduce the SOC-based outcome, the information they need, and the welfare cost of not having it. Without it, the value of the reform can't be measured on equal terms.\n\nForecast-error studies of storage usually perturb renewable output and keep prices perfect (e.g. [[Martinez-Rico et al. 2020]]) — the price error is what [[RQ3 Cost of imperfect information]] measures.\n\n## Figures and sources\n\n- [[thesis_report.pdf#page=22|Report §2.7 — Research gap (Table 2.2)]]"}, {"id": "Contributions", "folder": "Research", "type": "concept", "tags": ["research"], "aliases": [], "body": "1. Both designs in one model (DC network in node pairs, ramps, elastic demand, several ESS) with full [[KKT conditions]]; proof that Baldick's design is a [[Competitive equilibrium]] via the [[MCP formulation]].\n2. Exact equivalence: [[Prop 5.1 KKT equivalence]], [[Prop 5.2 Lagrangian relaxation]].\n3. Information result: [[Thm 6.3 Bids from technical data and prices]], [[Cor 6.15 Several ESS]].\n4. All equivalent bids as a polyhedron + robust [[Pre-limit selection rule]] ([[Prop 6.5 Polyhedron of equivalent bids]]).\n5. Closed forms: [[Cor 6.8 Max-min closed form]], [[Cor 6.14 Bids as functions of prices]].\n6. [[Computational burden]] quantified.\n7. Verified code ([[Numerical verification]]) and an experimental framework with first results ([[Stage 0 results]], [[Stage 1]]).\n\n## Figures and sources\n\n- [[thesis_report.pdf#page=16|Report §1.5 — Contributions]]"}, {"id": "Hypotheses", "folder": "Research", "type": "concept", "tags": ["research", "experiments"], "aliases": [], "body": "| | Hypothesis | Status (repo, Nov 2026) |\n|---|---|---|\n| H1 | True prices and quantities give zero loss ($\\Delta SW(\\mathcal B^\\star)=0$) | confirmed in [[Stage 0 results]], also with two batteries ([[Stage 1]]) |\n| H2 | Loss grows with $\\sigma$ and comes from hours where SOC limits bind | grows with σ: 5.8 → 7.9% of V, every paired step from σ = 2 resolved; split by hour still to run (`metrics.loss_by_soc_binding` exists) |\n| H3 | Persistent errors ($\\rho=0.9$) cost more than noise ($\\rho=0$) | not yet tested: stage 0 ran ρ = 0 only |\n| H4 | [[Pre-limit selection rule]] loses less than the solver's duals | at true prices the rule is irrelevant: all corners of the polyhedron give the same 1.30% ([[Coordination loss at perfect prices]]); under error, full grid needed |\n| H5 | Common errors ($\\omega=1$) cost more than independent ones | testable from [[Stage 1]] (two owners); so far the bid crossing dominates |\n| H6 | A forecast beats technical data below a threshold σ* that grows with ψ | not in the stage-0 case: at ψ = 10 technical-data bids (3.1%) lose less than forecast bids at every σ (5.8–7.9%); forecast runs at ψ = 0 and 50 not done yet ([[Value of a forecast]]) |\n\nTested in [[Stage 1]]–[[Stage 3]]. Part of [[RQ3 Cost of imperfect information]].\n\n## Figures and sources\n\n![[tab_hypotheses.png]]\n*Report Table 9.4 — hypotheses, tests and status after stage 0*\n\n- [[thesis_report.pdf#page=64|Report §9.10]]"}, {"id": "Timeline and milestones", "folder": "Research", "type": "concept", "tags": ["planning"], "aliases": [], "body": "| ID | Milestone | Target | Status (Nov 2026) |\n|---|---|---|---|\n| M1 | Model formulation of both designs | Oct 2026 | done |\n| G1 | Design variants, evaluation and price-selection rules | Oct 2026 | proposed; see [[Open decisions for the supervisors]] |\n| M2 | Equivalence and information analysis | Nov 2026 | done |\n| M3 | Code base verified (Stage 0) | Nov 2026 | done — [[Stage 0 verification]], 21 tests pass |\n| G2 | Perfect forecast reproduces the exact bids | Dec 2026 | passed: $\\mathcal B^\\star$ gives 0, $\\mathcal B^{fcst}$ at σ = 0 equals $\\mathcal B^{\\star p}$ |\n| M4 | [[Stage 1]] results | Dec 2026 | redesigned as two batteries; case, figures and zero-error check done; grid not run |\n| M5 | [[Stage 2]] results | Jan 2027 | – (fleet data missing) |\n| G3 | Decision on the strategic extension ([[RQ4 Use by the operator]]) | Jan 2027 | – |\n| M6 | [[Stage 3]] results | Feb 2027 | – |\n| M7 | Thesis submission | Mar 2027 | – |\n\nExperiment design needs approval from [[Jalal Kazempour]] before the Stage 1 grid runs.\n\n## Figures and sources\n\n![[tab_milestones.png]]\n*Report Table 11.1 — milestones (November 2026)*\n\n- [[thesis_report.pdf#page=76|Report §11.3]]"}, {"id": "Current design", "folder": "Market designs", "type": "design", "tags": ["design"], "aliases": ["CD", "today's design"], "body": "Interval bids, no SOC in the clearing (e.g. ERCOT day-ahead, European coupling).\n\n- Every hour the battery submits a **bid** $u_t$ (buy/charge below it) and an **offer** $c_t$ (sell/discharge above it).\n- The ISO clears each hour; the battery enters the objective with $c_t g_t - u_t p_t$.\n- The owner must anticipate its own [[State of charge]] through its bids → it needs a price forecast.\n\nOptimality → two [[Price thresholds]] per hour: charge if $\\lambda_t\\le u_t$, discharge if $\\lambda_t\\ge c_t$.\n\nVariants: [[SOC-enforcing current design]] (CAISO, NYISO). Compare with [[Baldick SOC-based design]]. Clearing is an [[LP market clearing]].\n\n## Figures and sources\n\n![[slide_06.jpg]]\n*Defense slide 6: who manages the SOC*\n\n- [[thesis_report.pdf#page=23|Report ch. 3 — Market models]]"}, {"id": "Baldick SOC-based design", "folder": "Market designs", "type": "design", "tags": ["design"], "aliases": ["SOC design", "Baldick's design"], "body": "Proposed by [[Ross Baldick]] ([[Baldick 2026]]).\n\n- The owner submits only its [[Battery parameters (theta)]] and one price, the [[End-of-day value w]].\n- The ISO schedules the [[State of charge]] together with the rest of the system (SOC rows in the clearing).\n- Objective: rest of the market + wear $\\epsilon p_t+\\zeta g_t$ − $w(s_T-\\bar{\\bar s}_T)$.\n\nEfficient benchmark; is a [[Competitive equilibrium]] ([[Thm 4.7 SOC design is a competitive equilibrium]]). Its multipliers are [[Value of stored energy (pi)]] and [[Limit multipliers (nu)]].\n\nCosts of adopting it: [[Why not adopt Baldick directly]], [[Computational burden]]. Used in the experiments as the ex-post benchmark.\n\n## Figures and sources\n\n![[slide_06.jpg]]\n*Defense slide 6: who manages the SOC*\n\n![[slide_13.jpg]]\n*Defense slide 13: the two clearing problems*\n\n- [[thesis_report.pdf#page=23|Report ch. 3 — Market models]]"}, {"id": "SOC-enforcing current design", "folder": "Market designs", "type": "design", "tags": ["design"], "aliases": [], "body": "In between: the ISO models the SOC in the clearing but still uses hourly bids and no end-of-day value (CAISO, NYISO).\n\nKey fact: there, technical-data-only bids are always exact — [[Remark 5.8 SOC-enforcing current design]] — because the market computes the SOC rents itself.\n\nOpen question for next steps: how much of the [[RQ3 Cost of imperfect information]] loss disappears in this intermediate design. See [[CAISO]].\n\n## Figures and sources\n\n- [[thesis_report.pdf#page=39|Report Remark 5.8]]"}, {"id": "Why not adopt Baldick directly", "folder": "Market designs", "type": "concept", "tags": ["motivation"], "aliases": [], "body": "Six reasons a market may not adopt [[Baldick SOC-based design]] (soon):\n1. Reform cost and time (rules, software, settlement).\n2. Responsibility moves: the ISO operates assets it doesn't own.\n3. Model accuracy: efficiency, degradation, hybrids are hard to describe.\n4. Strategy moves to the declared parameters and $w$.\n5. SOC deviations: who pays when real time differs?\n6. Computation: see [[Computational burden]].\n\nHence the thesis question: can the [[Current design]] reach the same outcome? → [[RQ1 Equivalence]].\n\n## Figures and sources\n\n- [[ESS_thesis_defense.pdf#page=7|Defense slide 7]]"}, {"id": "European storage order (SDAC)", "folder": "Market designs", "type": "market", "tags": ["market", "europe"], "aliases": [], "body": "The European power exchanges (NEMO Committee) consulted in June 2026 on a new **storage order** type for the single day-ahead coupling (SDAC / Euphemia), expected go-live Q4 2027, so batteries can buy and sell within the day with less detailed price forecasts — the information question of [[RQ2 Information]]. Source: [[NEMO Committee 2026]].\n\n## Figures and sources\n\n- [[thesis_report.pdf#page=19|Report ch. 2 — State of the art]]"}, {"id": "ERCOT", "folder": "Market designs", "type": "market", "tags": ["market", "us"], "aliases": [], "body": "Texas. >10 GW of batteries by end 2024 ([[Potomac Economics 2025]]). Day-ahead market: interval bids, no SOC → example of the [[Current design]]. Real-time co-optimisation plus batteries (RTC+B) went live Dec 2025."}, {"id": "CAISO", "folder": "Market designs", "type": "market", "tags": ["market", "us"], "aliases": [], "body": "California. >17 GW of storage by mid-2026. SOC modelled in the clearing with hourly bids → [[SOC-enforcing current design]]. Uses storage [[CAISO default energy bids]] for market-power mitigation ([[CAISO DMM 2024]])."}, {"id": "CAISO default energy bids", "folder": "Market designs", "type": "concept", "tags": ["monitoring"], "aliases": ["DEB"], "body": "CAISO's reference bids for storage, used to mitigate bids when market power is suspected. Heuristic (opportunity-cost based). The thesis offers an exact, SOC-consistent alternative: the equivalent-bid map evaluated with the ISO's forecast → [[RQ4 Use by the operator]], [[ISO reference bids for market monitoring]]."}, {"id": "State of charge", "folder": "Model", "type": "concept", "tags": ["model"], "aliases": ["SOC"], "body": "Energy stored in the battery (MWh). Dynamics:\n$$s_t=\\gamma s_{t-1}+\\Delta T\\,\\alpha p_t-\\Delta T\\,\\beta g_t$$\nLimits $\\underline s\\le s_t\\le\\bar s$ written within the hour; power limits $p_t\\le\\bar p$, $g_t\\le\\bar g$.\n\nThe SOC links every hour of the day: what the battery sells at 8 pm depends on what it bought at noon. Who manages it is the difference between [[Current design]] (owner) and [[Baldick SOC-based design]] (market). Its multiplier is [[Value of stored energy (pi)]]; its limits give [[Limit multipliers (nu)]].\n\n## Figures and sources\n\n![[slide_12.jpg]]\n*Defense slide 12: the battery in Baldick's model*"}, {"id": "Battery parameters (theta)", "folder": "Model", "type": "concept", "tags": ["model", "notation"], "aliases": ["theta", "θ"], "body": "$\\theta=(\\alpha,\\beta,\\gamma,\\epsilon,\\zeta,\\underline s,\\bar s,\\bar p,\\bar g,s_0)$ — what the owner submits in [[Baldick SOC-based design]].\n\n| Symbol | Meaning |\n|---|---|\n| $\\alpha$ | charging efficiency: MWh stored per MWh bought |\n| $\\beta$ | MWh drawn from storage per MWh sold ($\\beta>\\alpha$: losses) |\n| $\\gamma$ | share of stored energy kept each hour |\n| $\\epsilon,\\zeta$ | wear cost per MWh charged / discharged |\n| $\\underline s,\\bar s$ | min / max energy stored |\n| $\\bar p,\\bar g$ | max charging / discharging power |\n| $s_0$ | initial energy |\n\nPlus the [[End-of-day value w]]. See [[State of charge]].\n\n## Figures and sources\n\n![[slide_12.jpg]]\n*Defense slide 12: the battery in Baldick's model*\n\n- [[ESS_thesis_defense.pdf#page=11|Defense slide 11: what the symbols mean]]"}, {"id": "End-of-day value w", "folder": "Model", "type": "concept", "tags": ["model", "notation"], "aliases": ["w"], "body": "Willingness to pay for each MWh still stored at the end of the day: how much the owner values keeping energy for tomorrow (\\$/MWh). In [[Baldick SOC-based design]] the terminal benefit is $b_e(\\Delta)=w_e\\Delta$ (linear) or concave piecewise linear. It anchors the [[Value of stored energy (pi)]]: $\\pi_T=w$.\n\nIn the experiments each owner may misjudge its own $w$: [[Terminal-value error]]."}, {"id": "Value of stored energy (pi)", "folder": "Model", "type": "concept", "tags": ["model", "key"], "aliases": ["pi", "π"], "body": "$\\pi_t$: value of one extra MWh stored at the end of hour $t$ — the multiplier of the SOC dynamics in [[Baldick SOC-based design]]. **The key quantity of the thesis.**\n\nOver time (costate):\n$$\\pi_t=\\gamma\\big(\\pi_{t+1}-\\bar\\nu_{t+1}+\\underline\\nu_{t+1}\\big),\\qquad \\pi_T=w$$\nRead backwards from [[End-of-day value w]]: flat between limits (only losses $\\gamma$ change it), jumps where the battery is full or empty ([[Limit multipliers (nu)]]). This splits the day into [[Segments and marginal intervals]].\n\nEnters the [[Price thresholds]] and the [[Equivalent bids]]. The owner can compute it from its own [[Self-schedule problem]].\n\n## Figures and sources\n\n![[slide_16.jpg]]\n*Defense slide 16: what π and ν mean*\n\n![[tab_pi_range.png]]\n*Report Table 3.1 — admissible π in the base case*\n\n- [[thesis_report.pdf#page=27|Report §3.5 — Meaning of the multipliers]]"}, {"id": "Limit multipliers (nu)", "folder": "Model", "type": "concept", "tags": ["model"], "aliases": ["nu", "ν"], "body": "$\\bar\\nu_t$: extra value of one more MWh of room when the battery is **full**; $\\underline\\nu_t$: extra value of one more MWh of energy when it is **empty**. They are the size of the jumps of [[Value of stored energy (pi)]] at the SOC limits. Non-unique at limit hours → [[Pre-limit selection rule]].\n\n## Figures and sources\n\n![[slide_16.jpg]]\n*Defense slide 16: what π and ν mean*\n\n![[tab_pi_range.png]]\n*Report Table 3.1 — admissible π in the base case*"}, {"id": "Price thresholds", "folder": "Model", "type": "concept", "tags": ["model", "key"], "aliases": [], "body": "For the battery the [[KKT conditions]] say: in each hour charge below one price, discharge above another, idle in between.\n\n| Design | charge if | discharge if |\n|---|---|---|\n| [[Current design]] | $\\lambda_t\\le u_t$ | $\\lambda_t\\ge c_t$ |\n| [[Baldick SOC-based design]] | $\\lambda_t\\le\\alpha(\\pi_t-\\bar\\nu_t)-\\epsilon$ | $\\lambda_t\\ge\\zeta+\\beta(\\pi_t+\\underline\\nu_t)$ |\n\nIntuition: a MWh bought becomes $\\alpha$ MWh stored, worth $\\alpha\\pi$, minus wear; a MWh sold uses $\\beta$ MWh of storage, worth $\\beta\\pi$, plus wear. Setting the two pairs equal gives the [[Equivalent bids]].\n\n## Figures and sources\n\n![[slide_17.jpg]]\n*Defense slide 17: two price thresholds per hour*"}, {"id": "KKT conditions", "folder": "Model", "type": "concept", "tags": ["model", "method"], "aliases": ["KKT"], "body": "Both clearing problems are linear programs ([[LP market clearing]]), so their optima are fully characterised by the Karush–Kuhn–Tucker conditions: stationarity, primal/dual feasibility, complementary slackness. Read as a market: at the prices no participant wants to change its schedule.\n\nLabels in the report: (A1)–(A7) common, (C1)–(C2) current design, (A8)–(A12) SOC rows. Compared term by term in [[Prop 5.1 KKT equivalence]]; partitioned by participant in [[Thm 4.4 Partition of the KKT system]].\n\n## Figures and sources\n\n![[tab_kkt_compare.png]]\n*Report Table 5.1 — KKT conditions of the two designs*\n\n- [[thesis_report.pdf#page=25|Report §3.4 — Lagrangian and KKT conditions]]"}, {"id": "LP market clearing", "folder": "Model", "type": "concept", "tags": ["model"], "aliases": ["LP"], "body": "The ISO clears the day-ahead market by minimising the cost of cleared offers minus the value of cleared demand, subject to balance at every bus, network, ramps, and (in Baldick's design) SOC rows. Nodal prices = duals of the balance rows. No unit commitment / binaries (modelling assumption) — and none needed for storage: [[No binaries needed]]. Solved with HiGHS. See [[Network in node pairs]].\n\n## Figures and sources\n\n![[slide_13.jpg]]\n*Defense slide 13: the two clearing problems*"}, {"id": "Network in node pairs", "folder": "Model", "type": "concept", "tags": ["model", "convention"], "aliases": [], "body": "DC network written with node pairs $(n,m)$ (from/to) instead of line indices — preference of the supervisors ([[Jalal Kazempour]], [[Lukas Alfred Stippel]]). Flows and angles belong to a fictitious network agent in the [[MCP formulation]].\n\n## Figures and sources\n\n- [[thesis_report.pdf#page=23|Report §3.1 — Common market model]]"}, {"id": "Self-schedule problem", "folder": "Model", "type": "concept", "tags": ["model", "key"], "aliases": ["P_SS", "own problem"], "body": "The battery's own price-taking problem at a price path $\\lambda$:\n$$\\max_{p,g,s}\\ \\sum_t\\Delta T\\big[\\lambda_t(g_t-p_t)-\\epsilon p_t-\\zeta g_t\\big]+w\\,(s_T-\\bar{\\bar s}_T)$$\ns.t. its own SOC and power limits. Small LP, one battery (report Def. 4.1, $P^{SS}_e(\\lambda)$).\n\nIts duals are $(\\pi,\\bar\\nu,\\underline\\nu)$ → plugged into (E) they give valid [[Equivalent bids]] ([[Thm 6.3 Bids from technical data and prices]]). It is exactly the storage block of Baldick's market ([[Cor 4.9 Storage block is the owner's problem]], [[Lemma 6.2 Decomposition]]). In experiments it is solved at a forecast $\\hat\\lambda$.\n\nIn the experiment code the owner's problem carries a [[Throughput tie-breaker]] (`bids.self_schedule`).\n\n## Figures and sources\n\n![[def_4_1.png]]\n*Report Definition 4.1*\n\n![[slide_22.jpg]]\n*Defense slide 22: the battery's own problem*"}, {"id": "MCP formulation", "folder": "Model", "type": "concept", "tags": ["model", "equilibrium"], "aliases": ["MCP"], "body": "Baldick's market written as a mixed complementarity problem: every participant solves its own problem at the prices, and the prices clear the market.\n- (B1) generator, (B2) load, (B3) storage owner = [[Self-schedule problem]], (B4) network agent (buys at one end, sells at the other).\n- Rows (M1)–(M11); market clearing (balance) is the only condition owned by nobody.\n\nResults: [[Thm 4.4 Partition of the KKT system]], [[Thm 4.7 SOC design is a competitive equilibrium]], [[Cor 4.9 Storage block is the owner's problem]]. Speed question: [[MCP vs optimisation speed]].\n\n## Figures and sources\n\n![[participants_a.png]]\n*Participant problems (B1)–(B2) — report §4.1*\n\n![[participants_b.png]]\n*Participant problems (B3)–(B4) — report §4.1*\n\n![[mcp_box.png]]\n*The MCP of the SOC-based design, (M1)–(M11) — report §4.2*\n\n![[mcp_table.png]]\n*Report Table 4.1 — each KKT condition belongs to one participant*\n\n![[slide_14.jpg]]\n*Defense slide 14: Baldick's design is a market equilibrium*\n\n- [[thesis_report.pdf#page=29|Report ch. 4 — The SOC-based design as an equilibrium]]\n- [[thesis_report.pdf#page=31|Report §4.2 — The MCP]]"}, {"id": "Competitive equilibrium", "folder": "Model", "type": "concept", "tags": ["model", "equilibrium"], "aliases": [], "body": "A dispatch and nodal prices such that (i) at the prices each participant's part is optimal for its own problem and (ii) markets clear. Assumptions (E1) price-taking, (E2) convexity, (E3) separability by owner, (E4) $w$ non-increasing. See [[Thm 4.7 SOC design is a competitive equilibrium]], [[MCP formulation]].\n\n## Figures and sources\n\n![[thm_4_7.png]]\n*Report Theorem 4.7*\n\n![[slide_14.jpg]]\n*Defense slide 14: market equilibrium*"}, {"id": "Equivalent bids", "folder": "Model", "type": "concept", "tags": ["key", "result"], "aliases": ["(E)", "equivalent bid map"], "body": "**(E)** Bid and offer exactly at Baldick's [[Price thresholds]], every hour, blocks at full power:\n$$u_t=\\alpha(\\pi_t-\\bar\\nu_t)-\\epsilon,\\qquad c_t=\\zeta+\\beta(\\pi_t+\\underline\\nu_t)$$\nThen both markets have the same [[KKT conditions]]: same prices, same schedules ([[Prop 5.1 KKT equivalence]]).\n\n**Catch:** $\\pi,\\nu$ come from Baldick's market, which doesn't run today → the owner gets them from its [[Self-schedule problem]] ([[Thm 6.3 Bids from technical data and prices]]).\n\nForms: [[Cor 5.4 Information in the bids]], [[Cor 5.5 Technical-data-only bids]], [[Cor 6.8 Max-min closed form]], [[Cor 6.14 Bids as functions of prices]]; set of all: [[Prop 6.5 Polyhedron of equivalent bids]]. Example: [[Baldick base case]].\n\n## Figures and sources\n\n![[eq_E.png]]\n*Report §5.2 — the equivalent bids (E)*\n\n![[slide_18.jpg]]\n*Defense slide 18: equivalent bids*\n\n![[slide_19.jpg]]\n*Defense slide 19: band example*\n\n![[fig_base_bid_bands.png]]\n*Equivalent bids in Baldick's base case*\n\n- [[thesis_report.pdf#page=37|Report §5.2]]"}, {"id": "Thm 4.4 Partition of the KKT system", "folder": "Results", "type": "result", "tags": ["result", "equilibrium"], "aliases": [], "body": "Under separability by owner, a point satisfies the [[KKT conditions]] of Baldick's problem **iff** it solves the [[MCP formulation]] (M1)–(M11). Each KKT condition belongs to exactly one participant; balance is the only shared one. Report §4.3.\n\n## Figures and sources\n\n![[thm_4_4.png]]\n*Report Theorem 4.4*\n\n![[mcp_table.png]]\n*Report Table 4.1*\n\n- [[thesis_report.pdf#page=32|Report §4.3]]"}, {"id": "Thm 4.7 SOC design is a competitive equilibrium", "folder": "Results", "type": "result", "tags": ["result", "equilibrium"], "aliases": [], "body": "Under (E1)–(E4), the optimum of [[Baldick SOC-based design]] with its prices is a [[Competitive equilibrium]]: every participant would choose its own part at those prices. Conversely, every competitive equilibrium (with multipliers in the right sets) is optimal. Report §4.4.\nCorollary 4.8: individual rationality and revenue adequacy.\n\n## Figures and sources\n\n![[thm_4_7.png]]\n*Report Theorem 4.7*\n\n- [[thesis_report.pdf#page=33|Report §4.4]]"}, {"id": "Cor 4.9 Storage block is the owner's problem", "folder": "Results", "type": "result", "tags": ["result", "key"], "aliases": [], "body": "The storage rows (M4)–(M8) of each battery are exactly the KKT system of its own [[Self-schedule problem]] at the equilibrium prices, so the operator's storage multipliers $(\\pi^\\star,\\bar\\nu^\\star,\\underline\\nu^\\star)$ are optimal multipliers of the owner's problem. **This is what makes [[Thm 6.3 Bids from technical data and prices]] possible.** Report §4.6.\n\n## Figures and sources\n\n![[cor_4_9.png]]\n*Report Corollary 4.9*\n\n- [[thesis_report.pdf#page=35|Report §4.6]]"}, {"id": "Prop 5.1 KKT equivalence", "folder": "Results", "type": "result", "tags": ["result", "key", "rq1"], "aliases": ["Proposition 1"], "body": "Let $z^\\star$ be primal–dual optimal for Baldick's problem. Under the [[Equivalent bids]] (E) with blocks at full power, $z^\\star$ restricted to the current-design variables is optimal for the [[Current design]], with the same nodal prices.\n\nProof idea: rest of market identical; battery rows differ only in the [[Price thresholds]]; (E) makes them equal; LP ⇒ same conditions, same optimum. Holds with network, ramps, elastic demand, any number of ESS. Answers [[RQ1 Equivalence]]. Verified: [[Numerical verification]]. Report §5.2.\n\n## Figures and sources\n\n![[prop_5_1.png]]\n*Report Proposition 5.1*\n\n![[tab_kkt_compare.png]]\n*Report Table 5.1*\n\n- [[thesis_report.pdf#page=37|Report §5.2]]"}, {"id": "Prop 5.2 Lagrangian relaxation", "folder": "Results", "type": "result", "tags": ["result", "rq1"], "aliases": ["Proposition 2"], "body": "Dualise the SOC rows (A8)–(A10) of Baldick's problem at its optimal multipliers: the SOC variables drop out, the battery coefficients become exactly (E), and\n$$f^{SOC\\star}=f^{CD\\star}+K$$\nwith $K$ = value of initial energy + rents at the SOC limits + terminal benefit. A current-design optimum is SOC-optimal only if some SOC path is feasible and consistent with the rents. Report §5.3. See [[Equivalent bids]].\n\n## Figures and sources\n\n![[prop_5_2.png]]\n*Report Proposition 5.2*\n\n- [[thesis_report.pdf#page=37|Report §5.3]]"}, {"id": "Prop 5.3 Stepped bids", "folder": "Results", "type": "result", "tags": ["result", "rq1"], "aliases": ["Proposition 3"], "body": "For arbitrary stepped bid/offer blocks: Baldick's solution is optimal for the [[Current design]] **iff**, for every battery and hour, Baldick's schedule lies on the battery's bid and offer curves at Baldick's prices. Report §5.4. Generalises [[Prop 5.1 KKT equivalence]]; underlies the [[Quantity rule]].\n\n## Figures and sources\n\n![[prop_5_3.png]]\n*Report Proposition 5.3*\n\n- [[thesis_report.pdf#page=38|Report §5.4]]"}, {"id": "Cor 5.4 Information in the bids", "folder": "Results", "type": "result", "tags": ["result", "rq2"], "aliases": ["Corollary 1"], "body": "Unrolling the costate of [[Value of stored energy (pi)]]:\n$$c_t=\\zeta+\\beta\\Big[\\gamma^{T-t}\\pi_T+\\sum_{\\tau>t}\\gamma^{\\tau-t}(\\underline\\nu_\\tau-\\bar\\nu_\\tau)+\\underline\\nu_t\\Big]$$\n(similarly $u_t$). The bids contain **private data** ($\\alpha,\\beta,\\gamma,\\epsilon,\\zeta,w$) and the battery's own **SOC rents**, which depend on the rest of the market only through its local prices ([[Thm 6.3 Bids from technical data and prices]]). Report §5.5.\n\n## Figures and sources\n\n![[cor_5_4.png]]\n*Report Corollary 5.4*\n\n- [[thesis_report.pdf#page=38|Report §5.5]]"}, {"id": "Cor 5.5 Technical-data-only bids", "folder": "Results", "type": "result", "tags": ["result", "rq2"], "aliases": ["Corollary 2", "private bids"], "body": "If $b_e(\\Delta)=w\\Delta$ and no SOC limit binds from $t$ to the end:\n$$u_t=\\alpha\\gamma^{T-t}w-\\epsilon,\\qquad c_t=\\zeta+\\beta\\gamma^{T-t}w$$\nOnly private data. Used as the lower bound $\\mathcal B^{priv}$ in the [[Bid families]]. Always exact in the [[SOC-enforcing current design]] ([[Remark 5.8 SOC-enforcing current design]]). Report §5.5.\n\n## Figures and sources\n\n![[cor_5_5.png]]\n*Report Corollary 5.5*\n\n- [[thesis_report.pdf#page=39|Report §5.5]]"}, {"id": "Remark 5.6 Quantity indeterminacy", "folder": "Results", "type": "result", "tags": ["result", "quantities"], "aliases": [], "body": "Where a battery **sets** the price, the market is indifferent to how much it trades: the cleared quantity is indeterminate. Exact reproduction of Baldick's outcome therefore also needs quantity information. In [[Stage 0 results]] the battery's own plan at perfect prices costs 1.30% of the storage value (6.32% without the [[Throughput tie-breaker]]): see [[Coordination loss at perfect prices]]. Handled in experiments by the [[Quantity rule]]; separated in the [[Loss decomposition]].\n\n## Figures and sources\n\n- [[thesis_report.pdf#page=39|Report Remark 5.6]]"}, {"id": "Remark 5.8 SOC-enforcing current design", "folder": "Results", "type": "result", "tags": ["result"], "aliases": [], "body": "In a current design that enforces the SOC in the clearing ([[SOC-enforcing current design]], CAISO/NYISO type), [[Cor 5.5 Technical-data-only bids]] are always exact: the market computes the SOC rents itself. Next step: measure how much of the [[RQ3 Cost of imperfect information]] loss disappears there.\n\n## Figures and sources\n\n- [[thesis_report.pdf#page=39|Report Remark 5.8]]"}, {"id": "Lemma 6.2 Decomposition", "folder": "Results", "type": "result", "tags": ["result", "rq2"], "aliases": [], "body": "For every battery, Baldick's schedule is optimal for its own [[Self-schedule problem]] at Baldick's prices, and Baldick's storage multipliers are optimal duals of it. Same message as [[Cor 4.9 Storage block is the owner's problem]], proved directly from the KKT system. Report §6.1.\n\n## Figures and sources\n\n![[lem_6_2.png]]\n*Report Lemma 6.2*\n\n- [[thesis_report.pdf#page=41|Report §6.1]]"}, {"id": "Thm 6.3 Bids from technical data and prices", "folder": "Results", "type": "result", "tags": ["result", "key", "rq2"], "aliases": ["Theorem 1"], "body": "**Main information result.** Take *any* optimal dual $m_e$ of each battery's own [[Self-schedule problem]] at its local prices $\\lambda^\\star$ and submit (E). Then the [[Current design]] clears at Baldick's dispatch and prices.\n\nThe bids depend only on the battery's [[Battery parameters (theta)]] and its **local prices** — not on other participants, the network, ramps, or the multipliers the operator's solver returns.\n\nFlow: inputs (θ, λ) → own LP → any optimal dual (π, ν̄, ν̲) → bids (E). The gap between the designs is a gap in **price information**. Extends to many ESS: [[Cor 6.15 Several ESS]]. Answers [[RQ2 Information]]. Report §6.1. Also called \"Theorem 1\" in the slides.\n\n## Figures and sources\n\n![[thm_6_3.png]]\n*Report Theorem 6.3*\n\n![[slide_22.jpg]]\n*Defense slide 22: the battery's own problem gives the right numbers*\n\n- [[thesis_report.pdf#page=42|Report §6.1]]"}, {"id": "Prop 6.5 Polyhedron of equivalent bids", "folder": "Results", "type": "result", "tags": ["result", "rq2"], "aliases": ["Phi", "Φ"], "body": "Given prices $\\lambda$ and any optimal schedule of the [[Self-schedule problem]], the set of all equivalent bids is a polyhedron $\\Phi(\\theta,\\lambda)=\\{E(m): m \\text{ optimal dual}\\}$, described with the sets of hours where the SOC rows are tight ($\\mathcal U$ full, $\\mathcal L$ empty). Verified: polyhedron = dual face ([[Numerical verification]]). Report §6.2. Also \"Prop. 5\" in the slides.\n\nIn the experiments (`verify_price_based.prop5_polyhedron`, figures from `scripts/plot_multiplier_polyhedron.py`): at $\\lambda^\\star$ the polyhedron is a square in $(\\pi_2,\\pi_4)$; under a forecast the ranges move and open up, and the polyhedron becomes 4- or 5-dimensional ([[Coordination loss at perfect prices]]).\n\n## Figures and sources\n\n![[prop_6_5.png]]\n*Report Proposition 6.5*\n\n![[fig_check_pi.png]]\n*Admissible π in Baldick's three cases (report Figure 8.2)*\n\n![[repo_fig_poly_ranges.png]]\n*Valid π ranges at true prices and for 8 forecast draws*\n\n![[repo_fig_poly_3d.png]]\n*One forecast draw: projection of Π on (π₂, π₃, π₄)*\n\n- [[thesis_report.pdf#page=43|Report §6.2]]"}, {"id": "Cor 6.6 When prices pin pi", "folder": "Results", "type": "result", "tags": ["result", "rq2"], "aliases": ["Corollary 5"], "body": "If an hour is not a limit hour, $\\pi_{t-1}=\\gamma\\pi_t$; prices pin $\\pi$ (and hence the bids) everywhere **except** at hours where an SOC limit is reached and cannot be undone. There a range of $\\pi$ is valid → the [[Pre-limit selection rule]] chooses. Report §6.2.\n\n## Figures and sources\n\n![[cor_6_6.png]]\n*Report Corollary 6.6*\n\n- [[thesis_report.pdf#page=43|Report §6.2]]"}, {"id": "Cor 6.8 Max-min closed form", "folder": "Results", "type": "result", "tags": ["result", "closed-form"], "aliases": ["Corollary 3", "max-min"], "body": "If at most one SOC limit is active per interval:\n$$c_t=\\zeta+\\beta\\max\\Big\\{\\pi_t,\\frac{\\pi_{t-1}}{\\gamma}\\Big\\},\\qquad u_t=\\alpha\\min\\Big\\{\\pi_t,\\frac{\\pi_{t-1}}{\\gamma}\\Big\\}-\\epsilon$$\nThe battery offers at the higher and bids at the lower of the values of stored energy at the start and end of the hour. (The \"min{·}\" on the lecture-notes slide 24 stays as is.) Report §6.3. \"Cor. 3\" in older notes.\n\n## Figures and sources\n\n![[cor_6_8.png]]\n*Report Corollary 6.8*\n\n- [[thesis_report.pdf#page=44|Report §6.3]]"}, {"id": "Segments and marginal intervals", "folder": "Results", "type": "concept", "tags": ["result", "intuition", "key"], "aliases": ["marginal interval", "segments"], "body": "Between two hours where the battery becomes full or empty no limit binds: a MWh can be moved freely, so stored energy has **one value** $\\pi$ (up to losses $\\gamma$) → the day splits into **segments**.\n\n**Marginal interval** (Def. 6.9): an hour where the battery trades only part of its power and no limit binds. There the price reveals $\\pi$ (Lemma 6.10):\n$$\\pi=\\frac{\\lambda+\\epsilon}{\\alpha}\\ \\text{(partial charge)},\\qquad \\pi=\\frac{\\lambda-\\zeta}{\\beta}\\ \\text{(partial discharge)}$$\nLemma 6.11: carried through the segment, $\\pi_t=\\gamma^{t'-t}\\pi_{t'}$. Lemma 6.12: **which price sets it** — the highest price at which it charges only partly, or the lowest at which it discharges only partly, in the same segment.\n\nIntuition: [[Five-hour segment example]]; dynamics: [[Baldick base case]]. Leads to [[Prop 6.13 Value of stored energy from prices]]. An error in the marginal hour's price moves the bids of the whole segment.\n\n## Figures and sources\n\n![[slide_24.jpg]]\n*Defense slide 24: segments*\n\n![[slide_25.jpg]]\n*Defense slide 25: which price sets π*\n\n![[def_6_9.png]]\n*Report Definition 6.9*\n\n![[lem_6_10.png]]\n*Report Lemma 6.10*\n\n![[lem_6_12.png]]\n*Report Lemma 6.12*\n\n- [[thesis_report.pdf#page=45|Report §6.4]]"}, {"id": "Prop 6.13 Value of stored energy from prices", "folder": "Results", "type": "result", "tags": ["result", "closed-form"], "aliases": ["Proposition 4"], "body": "If every segment contains a marginal interval, $\\pi_t$ is rebuilt from prices only: $\\pi_t=\\gamma^{\\tilde t_k-t}v_k(\\lambda^\\star)$ in segment $k$, and $w$-based after the last limit. Verified \"π rebuilt from prices only\" in [[Numerical verification]]. See [[Segments and marginal intervals]]. Report §6.4. (\"Prop. 4\" in the slides.)\n\n## Figures and sources\n\n![[prop_6_13.png]]\n*Report Proposition 6.13*\n\n- [[thesis_report.pdf#page=46|Report §6.4]]"}, {"id": "Cor 6.14 Bids as functions of prices", "folder": "Results", "type": "result", "tags": ["result", "closed-form"], "aliases": [], "body": "Combining [[Cor 6.8 Max-min closed form]] and [[Prop 6.13 Value of stored energy from prices]]: the bids depend on the private parameters, the prices of the marginal intervals and the binding hours. $(u,c)=\\Phi(\\theta,\\lambda)$. Report §6.4.\n\n## Figures and sources\n\n![[cor_6_14.png]]\n*Report Corollary 6.14*\n\n- [[thesis_report.pdf#page=47|Report §6.4]]"}, {"id": "Cor 6.15 Several ESS", "folder": "Results", "type": "result", "tags": ["result", "rq2"], "aliases": [], "body": "With many batteries, each one independently solves its own [[Self-schedule problem]] at its local prices, picks any optimal dual and builds (E): the current design still clears at Baldick's outcome. No coordination needed.\n\nCheck: Baldick's system with 5 heterogeneous batteries, 200 random joint choices of duals → optimality violation and price difference zero to machine precision (1.7e-14, 7e-15). See [[Numerical verification]]. Report §6.6.\n\n## Figures and sources\n\n![[cor_6_15.png]]\n*Report Corollary 6.15*\n\n![[slide_23.jpg]]\n*Defense slide 23: any number of batteries*\n\n![[tab_five_ess.png]]\n*Report Table 8.2 — the five batteries of the check*\n\n- [[thesis_report.pdf#page=48|Report §6.6]]"}, {"id": "Pre-limit selection rule", "folder": "Results", "type": "concept", "tags": ["method", "robustness"], "aliases": ["selection rule"], "body": "At hours where the battery becomes full or empty, any $\\pi$ in a range is valid with perfect prices ([[Cor 6.6 When prices pin pi]]), but the choice decides robustness to price errors.\n\nRule: keep the value carried in from the previous hour whenever admissible,\n$$\\pi^R_t=\\min\\Big\\{\\max\\Big\\{\\frac{\\pi^R_{t-1}}{\\gamma},\\pi^-_t\\Big\\},\\pi^+_t\\Big\\}$$\nEffect in the [[Baldick base case]]: risky actions (selling when empty at t=3, buying when full at t=5) get a 50 \\$/MWh margin instead of 2.11 / 6.9 with the solver's duals; small margins only where the unwanted action is feasible. Tested in H4 ([[Hypotheses]]). Report §6.5.\n\nCode: `bids._prelimit_vertex` (sequential clip, $\\nu$ solved from the polyhedron's recursion); alternative `\"solver\"` = vertex minimising $\\sum\\pi$. At true prices both rules give the same day-ahead schedule ([[Coordination loss at perfect prices]]).\n\n## Figures and sources\n\n![[slide_26.jpg]]\n*Defense slide 26: choose robustly*\n\n![[fig_base_pi_range.png]]\n*Admissible π and the selection rules in the base case*\n\n![[repo_nb_bid_bands.png]]\n*Bid bands from the selected multipliers (stage-0 notebook)*\n\n- [[thesis_report.pdf#page=47|Report §6.5]]"}, {"id": "Computational burden", "folder": "Computation", "type": "concept", "tags": ["computation"], "aliases": ["burden"], "body": "Extra size of [[Baldick SOC-based design]] for $E$ batteries and $T$ intervals:\n$$\\Delta\\text{rows}=3ET,\\quad\\Delta\\text{cols}=ET,\\quad\\Delta\\text{nnz}=8ET-3E$$\nStructure matters more than size: the SOC of hour $t$ depends on every decision before it; the hours can't be solved separately; eliminating SOC variables gives a dense triangular block, $O(ET^2)$.\n\nStill an LP: [[No binaries needed]]. Measured: [[Solve-time benchmark]]. Consequence: Baldick's model is heavy in operation but ideal as an **ex-post benchmark** (how the experiments use it). Part of [[Why not adopt Baldick directly]]. Report ch. 7.\n\n## Figures and sources\n\n![[slide_08.jpg]]\n*Defense slide 8: rows that couple every hour*\n\n![[tab_burden.png]]\n*Report Table 7.1 — problem size and solve times*\n\n- [[thesis_report.pdf#page=50|Report ch. 7]]"}, {"id": "No binaries needed", "folder": "Computation", "type": "result", "tags": ["computation", "result"], "aliases": [], "body": "$$\\pi_t>-\\frac{\\epsilon+\\zeta}{\\beta-\\alpha}\\ \\Longrightarrow\\ c_t-u_t>0\\ \\Longrightarrow\\ \\text{never charge and discharge at once}$$\nRound-trip losses make simultaneous charging and discharging unprofitable whenever stored energy has a non-negative value: both clearings stay LPs. Report §7.3.\n\n## Figures and sources\n\n- [[thesis_report.pdf#page=51|Report §7.3]]"}, {"id": "Solve-time benchmark", "folder": "Computation", "type": "data", "tags": ["computation", "data"], "aliases": [], "body": "Single-bus day with ramps, HiGHS dual simplex. Ratio of solve times SOC design / current design:\n\n| Batteries E | hourly (T=24) | 15-min (T=96) | 5-min (T=288) |\n|---|---|---|---|\n| 1 | 1.7× | | |\n| 10 | 3.0× | 2.1× | |\n| 50 | 2.2× | 5.8× | 14.0× |\n| 200 | 6.5× | 12.8× | 112× (44.7 s vs 0.4 s) |\n\nAbsolute times small for this simple system; the trend matters. See [[Computational burden]]. Report §7.4; slides \"The gap grows with batteries and time resolution\".\n\n## Figures and sources\n\n![[fig_burden.png]]\n*Solve-time ratio and nonzeros (report Figure 7.1)*\n\n![[slide_09.jpg]]\n*Defense slide 9: the gap grows*\n\n![[tab_burden.png]]\n*Report Table 7.1*\n\n- [[thesis_report.pdf#page=51|Report §7.4]]"}, {"id": "MCP vs optimisation speed", "folder": "Computation", "type": "concept", "tags": ["computation", "faq"], "aliases": [], "body": "Question asked during the project: is solving the market LP or its MCP faster? For a convex LP market, solving the LP directly (simplex / interior point, e.g. HiGHS) is normally faster and more robust; the [[MCP formulation]] is the same system of equations (the KKT conditions) but generic complementarity solvers (e.g. PATH) don't exploit LP structure. The MCP is valuable for **interpretation** (equilibrium, who owns which condition) and for non-optimisation equilibria (e.g. strategic or non-integrable models)."}, {"id": "Experimental pipeline", "folder": "Experiments", "type": "method", "tags": ["experiments", "method"], "aliases": ["pipeline"], "body": "One Monte Carlo draw, as coded in `Code/src/experiments/` ([[Code base]], [[Model structure document]]):\n\n| Step | Model | Code |\n|---|---|---|\n| Benchmark, once per case | M1 [[Baldick SOC-based design]] → $\\lambda^\\star$, schedule, $SW^\\star$, $SW_{noESS}$, $V$ | `benchmark.solve_benchmark` |\n| Forecast | $\\hat\\lambda_e$ from the [[Synthetic forecast error model]]; with owners, also $\\hat w_e$ ([[Terminal-value error]]) | `forecasts.forecast_prices`, `terminal_values` |\n| Bids | M3 [[Self-schedule problem]] at $\\hat\\lambda_e$ with the [[Throughput tie-breaker]] → M4 polyhedron + [[Pre-limit selection rule]] → [[Equivalent bids]] + [[Quantity rule]] | `bids.bid_fcst`, `quantity_blocks` |\n| Day-ahead | M5: one merit-order auction per interval with the **true** system | `market.clear_cd` |\n| Real time | M6 closest SOC-feasible schedule (L1), M7 redispatch at cost + ψ, shedding at VOLL ([[Real-time evaluation and premium psi]]) | `realtime.feasible_schedule`, `redispatch_hour` |\n| Evaluate | [[Welfare loss metric]], undeliverable MWh, shed MWh, price distortion, ESS profit | `welfare`, `metrics` |\n\nOnly the bid step sees the errors; clearing, real time and welfare use the true system and the true $w$. One draw takes a few hundredths of a second. Seeds give [[Common random numbers]]. The loop writes one CSV row per draw and a `meta.json` per stage, skips finished settings and never overwrites (`runner.run_all`). Compared across [[Bid families]]; results read with [[Regime analysis]].\n\n## Figures and sources\n\n![[slide_32.jpg]]\n*Defense slide 32: one Monte Carlo draw*\n\n- [[model_structure.pdf#page=2|Model structure §1 — big picture]]\n- [[model_structure.pdf#page=5|Model structure §4 — models M1–M7]]\n- [[model_structure.pdf#page=17|Model structure §8 — one draw end to end]]\n- [[thesis_report.pdf#page=57|Report §9.2 — structure of one experiment]]\n- [[thesis_report.pdf#page=62|Report §9.8 — pipeline]]"}, {"id": "Bid families", "folder": "Experiments", "type": "method", "tags": ["experiments"], "aliases": [], "body": "Ordered by information (`bids.py`):\n| Family | Prices | Quantities | Role | Stage 0 loss |\n|---|---|---|---|---|\n| $\\mathcal B^\\star$ | Baldick's duals | Baldick's schedule | gate: must lose 0 (H1) | 0.00% |\n| $\\mathcal B^{\\star p}$ | true $\\lambda^\\star$, own polyhedron point | own plan at $\\lambda^\\star$ | cost of the quantity plan | 1.30% |\n| $\\mathcal B^{fcst}$ | forecast $\\hat\\lambda_e$ (and $\\hat w_e$) | own plan at $\\hat\\lambda_e$ | main experiment | 5.8–7.9% (σ = 1–20 \\$/MWh) |\n| $\\mathcal B^{priv}$ | none: $\\pi_t=\\gamma^{T-t}\\hat w$, no rents | full capacity | lower bound ([[Cor 5.5 Technical-data-only bids]]) | 0 / 3.1 / 15.4% (ψ = 0/10/50) |\n\nReading: $\\mathcal B^{\\star p}-\\mathcal B^\\star$ = quantity plan · $\\mathcal B^{fcst}-\\mathcal B^{\\star p}$ = price forecast · $\\mathcal B^{fcst}$ vs $\\mathcal B^{priv}$ = [[Value of a forecast]]. Numbers: [[Stage 0 results]]. Used in [[Loss decomposition]]. Candidate new families: [[Richer bid curves (ideas A-E)]].\n\n## Figures and sources\n\n![[slide_30.jpg]]\n*Defense slide 30: four ways to bid*\n\n![[tab_bid_families.png]]\n*Report Table 9.2 — bid families*\n\n- [[model_structure.pdf#page=17|Model structure §8.1 — what each family isolates]]\n- [[thesis_report.pdf#page=58|Report §9.3]]"}, {"id": "Quantity rule", "folder": "Experiments", "type": "method", "tags": ["experiments", "quantities", "open"], "aliases": [], "body": "Where the battery sets the price, the market is indifferent to quantities ([[Remark 5.6 Quantity indeterminacy]]). Each battery bids its planned quantity just inside its price and **all its remaining power** just outside, so ties break in favour of its plan (`bids.quantity_blocks`):\n$$(u_t+\\delta,p^\\circ_t),\\ (u_t-\\delta,\\bar p-p^\\circ_t)\\qquad (c_t-\\delta,g^\\circ_t),\\ (c_t+\\delta,\\bar g-g^\\circ_t),\\quad \\delta=0.01\\ \\$/\\text{MWh}$$\n$\\mathcal B^{priv}$ sends one full-capacity block per side. Based on [[Prop 5.3 Stepped bids]].\n\n**Problem found with two batteries.** With Baldick's 1,000 MW power limits the second block offers up to 1,000 MW whatever the battery holds, so two owners' bids can cross and they trade with each other ([[Bids cross between batteries]]). Zero-error check in the [[Stage 1 two-battery case]]:\n| Rule | $\\mathcal B^{\\star p}$ loss | σ = 0, σ_w = 5 | draws shedding |\n|---|---|---|---|\n| current (all remaining power) | 38.1% | 22.4% | 57% |\n| plan only (no second block) | 84.6% | 84.6% | 100% |\n| second block capped by the SOC plan | **2.0%** | **2.0%** | **0%** |\n| current rule, power limits 100 MW | 0.6% | 0.7% | 0% |\n\nCap: $\\min\\{\\bar p,(\\bar s-\\gamma s^\\circ_{t-1})/(\\alpha\\Delta T)\\}-p^\\circ_t$ (charge), $\\min\\{\\bar g,(\\gamma s^\\circ_{t-1}-\\underline s)/(\\beta\\Delta T)\\}-g^\\circ_t$ (discharge). Removing the second block is worse: those blocks also move energy between batteries when their plans overlap. Decision pending → [[Open decisions for the supervisors]].\n\nExample ([[Baldick base case]]): the tie-broken plan charges 222.2 MW at 00–04h where $u_1=\\lambda^\\star_1=43.1$; it bids 222.2 MW at 43.11 and 777.8 MW at 43.09, and only the 100 MW of free surplus clear, since the next supply is thermal at 50.\n\n## Figures and sources\n\n![[eq_quantity_rule.png]]\n*Report eq. (9.3) — the quantity rule*\n\n- [[model_structure.pdf#page=7|Model structure §4.5 — the quantity rule]]\n- [[stage_1_structure.pdf#page=5|Stage 1 structure §6 — the bids cross]]\n- [[thesis_report.pdf#page=59|Report §9.5]]"}, {"id": "Synthetic forecast error model", "folder": "Experiments", "type": "method", "tags": ["experiments", "forecast"], "aliases": ["error model"], "body": "Implemented in `forecasts.forecast_prices`:\n$$\\hat\\lambda_{e,t}=\\max\\big(\\underline\\lambda,\\ \\lambda^\\star_t+b\\,\\bar\\lambda+\\sigma z_{e,t}\\big),\\qquad z_{e,t}=\\sqrt{\\omega}\\,\\chi_t+\\sqrt{1-\\omega}\\,\\eta_{e,t}$$\n$\\chi$ (common) and each $\\eta_e$ (own): stationary AR(1) with unit variance, $x_t=\\rho x_{t-1}+\\sqrt{1-\\rho^2}w_t$, $x_1,w_t\\sim N(0,1)$. All owners' errors are drawn together, once per draw, so $\\chi$ is truly shared (fixed for stage 1; it was redrawn per battery before).\n\n| Param | Controls | Values |\n|---|---|---|\n| σ | size: % of $\\bar\\lambda$ (`sigma_pct`) or \\$/MWh (`sigma_abs`, used in stage 0) | 0–40% · 0, 1, 2, 5, 10, 20 \\$/MWh |\n| ρ | persistence: 0 = noise, 0.9 = level | 0, 0.5, 0.9 |\n| b | bias, % of $\\bar\\lambda$ | −10, 0, +10% |\n| ω | common share across batteries | 0, 0.5, 1 |\n| $\\underline\\lambda$ | [[Price floor]] | 0 |\n\nEach draw's shape $z$ is fixed by its seed: [[Common random numbers]]. With several owners a second error enters: [[Terminal-value error]]. Pros: interpretable, full control, cheap, answers RQ3 as posed. Cons: assumed shape (same σ every hour, Gaussian), no causal link to renewables. Grounded by [[Calibration from historical forecasts]]; alternative: [[Renewable-driven forecast error]]. Full comparison in [[Forecast error note]]; defence of the values in the [[Model structure document]] §6.\n\n## Figures and sources\n\n![[slide_31.jpg]]\n*Defense slide 31: how we perturb the forecast*\n\n![[repo_nb_forecast_steps.png]]\n*How λ̂ is built from λ*, step by step (stage-0 notebook)*\n\n![[eq_error_model.png]]\n*Report eq. (9.4) — the error model*\n\n![[tab_errparams.png]]\n*Report Table 9.3 — parameters of the error model*\n\n![[fig_error_examples.png]]\n*Forecasts with σ = 10 \\$/MWh around Baldick's base case (report Figure 9.1)*\n\n- [[forecast_error_models_note.pdf#page=2|Forecast error note §2]]\n- [[model_structure.pdf#page=10|Model structure §5 — the forecast error]]\n- [[model_structure.pdf#page=12|Model structure §6 — choosing the error values]]\n- [[thesis_report.pdf#page=60|Report §9.6]]"}, {"id": "Renewable-driven forecast error", "folder": "Experiments", "type": "idea", "tags": ["idea", "forecast"], "aliases": [], "body": "**Proposal (stage-3 extension, not a replacement).** Perturb the battery's *renewable* forecast and let a market model turn it into a price forecast:\n$$W^e_{r,t}=\\big[W^{GC}_{r,t}+\\bar R_r(b_W+\\sigma_W s_{r,t}\\xi_{e,r,t})\\big]_0^{\\bar R_r},\\qquad \\hat\\lambda_e=\\lambda^{SOC}(W^e),\\ \\ \\lambda^\\star=\\lambda^{SOC}(W^{GC})$$\nOptional residual $+\\sigma_{res}\\bar\\lambda z$ for non-renewable sources (hybrid).\n\nRequirements: smooth supply curve (a stepped supply curve gives artefacts), compare against the **gate-closure** forecast not actual output, vary renewable share (20/40/60%), map each run back to $(\\hat\\sigma,\\hat\\rho,\\hat b,\\hat\\omega)$ on the synthetic curves.\n\nPros: links to the motivation (more renewables, more batteries), physically consistent forecasts, realistic structure and common errors emerge. Cons: depends strongly on the test system, optimistic forecaster, scarce data for the right comparison, less control, more time.\n\nWhy: price errors largely come from renewable errors — but for a stand-alone battery the price error already contains them ([[Renewable errors vs price errors]]). Written up in [[Forecast error note]]. Origin: [[Martinez-Rico et al. 2020]] discussion.\n\n## Figures and sources\n\n- [[forecast_error_models_note.pdf#page=4|Forecast error note §3 — the proposal]]\n- [[forecast_error_models_note.pdf#page=6|Forecast error note — requirements and experiments]]\n- [[forecast_error_models_note.pdf#page=7|Forecast error note §4 — pros and cons]]"}, {"id": "Renewable errors vs price errors", "folder": "Experiments", "type": "concept", "tags": ["forecast", "faq"], "aliases": [], "body": "For a stand-alone battery in the day-ahead market everything it doesn't know (wind, solar, demand, outages, fuel, other bids) reaches it only through the price → a price error calibrated on real forecasts already contains the renewable error; adding it on top double counts.\n\nRenewable errors add something only in: (1) the **shape** of the price error ([[Renewable-driven forecast error]]); (2) **after** day-ahead clearing — real-time deviations hitting both designs ([[Stochastic real-time extension]]); (3) **hybrid plants** behind the meter ([[Martinez-Rico et al. 2020]]).\n\n## Figures and sources\n\n- [[forecast_error_models_note.pdf|Forecast error note §1]]"}, {"id": "Calibration from historical forecasts", "folder": "Experiments", "type": "method", "tags": ["experiments", "forecast", "data"], "aliases": [], "body": "Plan for [[Stage 3]]: backtest a naive and a state-of-the-art forecaster (e.g. LEAR / DNN from the open `epftoolbox` benchmark, [[Lago et al. 2021]]) on Danish DK1 day-ahead prices; estimate $(b,\\sigma,\\rho,\\omega)$ from the residuals; add a day-block bootstrap of real error days to keep their true shape.\n\nRule of thumb: for roughly normal errors MAE ≈ 0.8σ. Good day-ahead forecasts are roughly 5–15% of the mean price (to verify) — inside the synthetic grid. Answers \"can the forecast error be known from historical data?\": yes, by backtesting. Report §9.5.\n\n## Figures and sources\n\n- [[forecast_error_models_note.pdf#page=4|Forecast error note §2.5]]\n- [[thesis_report.pdf#page=62|Report §9.7]]"}, {"id": "Real-time evaluation and premium psi", "folder": "Experiments", "type": "method", "tags": ["experiments"], "aliases": ["psi", "ψ"], "body": "After day-ahead clearing each battery delivers the **closest SOC-feasible schedule** (min L1 deviation, M6, `realtime.feasible_schedule`); undeliverable energy = $\\Delta T\\sum|p-p^{da}|+|g-g^{da}|$. Generators move from their day-ahead schedule paying their offer price plus a premium $\\psi$ per MWh moved up **or** down (M7, `redispatch_hour`); any shortage is shed at VOLL = 1000 \\$/MWh. ψ ∈ {0, 10, 50} \\$/MWh: frictionless · close to real imbalance penalties · stress test; the value of a forecast depends strongly on it ([[Value of a forecast]]).\n\n**Open with several batteries.** Real time treats a battery's feasible charge as firm load, even if that means shedding: in the zero-error check of the [[Stage 1 two-battery case]] B still charges 111 MW at 20–24h and 31 MW of load is shed. Should real time curtail the charge first? → [[Open decisions for the supervisors]].\n\n## Figures and sources\n\n![[repo_nb_realtime.png]]\n*Real time: repair and redispatch (stage-0 notebook)*\n\n- [[model_structure.pdf#page=9|Model structure §4.7–4.8 — M6, M7]]\n- [[thesis_report.pdf#page=62|Report §9.8]]"}, {"id": "Welfare loss metric", "folder": "Experiments", "type": "method", "tags": ["experiments", "metric"], "aliases": ["ΔSW"], "body": "$$\\Delta SW=SW^\\star-SW^{real}\\ge0,\\qquad \\text{loss}=\\frac{\\Delta SW}{SW^\\star-SW^{\\text{no storage}}}\\ (\\%\\text{ of storage value})$$\nNever negative (the benchmark is the optimum). >100% means the system would be better without the battery. Normalising by storage value makes systems, sizes and days comparable. Secondary: undeliverable energy, price distortion $|\\lambda^{CD}-\\lambda^\\star|$, σ* ([[Value of a forecast]]). See [[Loss decomposition]].\n\nCode: `metrics.dsw` asserts ΔSW ≥ −1e-6; `dsw_pct` = 100·ΔSW/V. One welfare function for benchmark and outcome: −(generation cost + ψ·redispatched MWh + VOLL·shed + degradation − Σ w_e s_{e,T}), always at the true $w_e$. In the [[Baldick base case]] V is mostly avoided load shedding, so percentages of V are small there ([[Stage 0 results]]).\n\n## Figures and sources\n\n![[slide_33.jpg]]\n*Defense slide 33: what we measure*\n\n- [[thesis_report.pdf#page=63|Report §9.9]]"}, {"id": "Loss decomposition", "folder": "Experiments", "type": "method", "tags": ["experiments", "metric"], "aliases": [], "body": "$$\\Delta SW=\\underbrace{\\Delta SW(\\mathcal B^{\\star p})}_{\\text{quantity information}}+\\underbrace{\\Delta SW(\\mathcal B^{fcst})-\\Delta SW(\\mathcal B^{\\star p})}_{\\text{price forecast}}$$\nAn accounting split using the [[Bid families]], not a separate result: the two effects can interact and the split depends on the order. Report eq. (9.9).\n\n**Repo, stage 0:** quantity part 1.30% (after the [[Throughput tie-breaker]]; 6.32% before), price-forecast part 4.5–6.6 points at σ = 1–20 \\$/MWh ([[Stage 0 results]]). Implemented as `metrics.decompose`.\n\n## Figures and sources\n\n![[eq_decomposition.png]]\n*Report eq. (9.9)*\n\n- [[thesis_report.pdf#page=63|Report §9.9]]"}, {"id": "Value of a forecast", "folder": "Experiments", "type": "result", "tags": ["experiments", "result"], "aliases": ["sigma*"], "body": "σ*: the error level where $\\mathcal B^{fcst}$ and $\\mathcal B^{priv}$ lose the same. Below σ* a forecast is worth having (H6 in [[Hypotheses]]: σ* should grow with ψ).\n\nTechnical-data-only bids ($\\mathcal B^{priv}$) lose exactly ψ × the energy they leave undeliverable. In [[Stage 0 results]] (Baldick's base case, 1,051 MWh undeliverable): 0 / 3.09 / 15.43% of V at ψ = 0 / 10 / 50. The ψ = 0 zero is specific to that case: the repaired schedule and the benchmark pass through the same full SOC.\n\n**Repo, stage 0 ([[Stage 0 results]]).** On the [[Baldick base case]] at ψ = 10, technical-data-only bids (3.09%) lose *less* than forecast bids at every σ (5.8–7.9%), so there is no σ* in this case; at ψ = 50 they lose 15.4%. Forecast bids have only been run at ψ = 10, so σ*(ψ) still needs the ψ grid.\n\n## Figures and sources\n\n![[repo_nb_bias.png]]\n*Effect of the bias on one draw (stage-0 notebook)*\n\n- [[thesis_report.pdf#page=69|Report §10.4 — technical-data-only bids]]"}, {"id": "Stage 0 verification", "folder": "Experiments", "type": "experiment", "tags": ["experiments", "done"], "aliases": ["Stage 0 gate", "stage 0"], "body": "**Stage 0 = the gate of the experiment code**, run by `scripts/run_stage0_gate.py` on the [[Baldick base case]] (one battery): 16 settings, 1,506 draws, about a minute. **Passed.**\n\nChecks: $\\mathcal B^\\star$ reproduces Baldick's dispatch through the whole pipeline and loses 0 to floating-point precision; ΔSW ≥ 0 for every draw; no simultaneous charge and discharge; $\\mathcal B^{fcst}$ at σ = 0 equals $\\mathcal B^{\\star p}$; the error model's sampling statistics (unit variance, lag-1 correlation ρ, cross-battery correlation ω, floor) match. 21 tests pass (re-run 1 Nov 2026).\n\nTest system: the [[Baldick base case]], small enough that every number of a draw can be checked by hand. Numbers: [[Stage 0 results]]. The theory checks are separate: [[Numerical verification]]. Report ch. 10.\n\n## Figures and sources\n\n- [[thesis_report.pdf#page=53|Report ch. 8]]\n- [[model_structure.pdf#page=19|Model structure §11–12 — verification and stage-0 numbers]]\n- [[thesis_report.pdf#page=66|Report ch. 10 — Stage 0]]"}, {"id": "Stage 1", "folder": "Experiments", "type": "experiment", "tags": ["experiments", "in-progress"], "aliases": [], "body": "**Redesigned (28 Oct 2026): two batteries, two errors.** Same one-bus system as stage 0, the 800 MWh battery split into owners A and B (400 MWh each, $w$ = 40 / 55): [[Stage 1 two-battery case]]. Each owner builds its bid alone from its own price forecast and its own [[Terminal-value error]]; both bids meet in one day-ahead market.\n\n**Done.** Case (`cases.stage1_case`), benchmark, errors, figures (`scripts/make_stage1_figures.py`), [[Stage 1 structure document]]. Gate: $\\mathcal B^\\star$ with two batteries loses 0 (test passes).\n\n**Blocked.** At zero error the two bids cross and the batteries trade with each other: 38.1% of V lost, 124 MWh shed ([[Bids cross between batteries]]). An exploratory run (40 draws, ω = 0.5) gave 21–102% with shedding in 52–100% of draws and no pattern in σ or σ_w: the crossing, not the errors, decides. Needs a decision on the [[Quantity rule]] and on real-time priority ([[Open decisions for the supervisors]]).\n\n**Proposed grid** (150 draws, seed 42, [[Common random numbers]]): σ ∈ {0, 1, 2, 5, 10, 20} \\$/MWh × σ_w ∈ {0, 2, 5, 10} × ω ∈ {0, 0.5, 1} = 72 settings, ~10,800 draws, ~20 min; ρ = 0, bias 0, ψ = 10, prelimit; plus $\\mathcal B^\\star$, $\\mathcal B^{\\star p}$, $\\mathcal B^{priv}$ (ψ = 0, 10, 50). Planned notebook `stage_1.ipynb` with a heatmap of loss over (σ, σ_w) and the effect of ω.\n\nNote: `config.py` still defines the older one-battery \"stage 1\" grid (σ 6 × ρ 3 × bias 3 × rule 2 × ψ 3 = 324 settings × 500 draws, ~80 min). Tests H2, H4, H5 ([[Hypotheses]]).\n\n## Figures and sources\n\n![[repo_s1_big_picture.png]]\n*Stage 1: two owners build their bids separately*\n\n- [[stage_1_structure.pdf|Stage 1 structure document]]\n- [[thesis_report.pdf#page=64|Report §9.11 — stages]]\n- [[thesis_report.pdf#page=70|Report §10.5 — stage 1]]"}, {"id": "Stage 2", "folder": "Experiments", "type": "experiment", "tags": ["experiments", "planned"], "aliases": [], "body": "Several batteries (5–20), fleet at 10/25/40% of peak load; effects of the common share ω (H5), fleet size and interaction through the price. Grid defined in `config.py` (ρ ∈ {0, 0.9}, bias 0, ω ∈ {0, 0.5, 1}, 500 draws), but `cases.fleet_case` raises `NotImplementedError`: the heterogeneous-battery data (`multi_ess.py`) is not in the repo, and the code refuses to invent it. The two-owner [[Stage 1]] already brings ω and owner interaction in. Target Jan 2027.\n\n## Figures and sources\n\n- [[thesis_report.pdf#page=64|Report §9.11]]"}, {"id": "Stage 3", "folder": "Experiments", "type": "experiment", "tags": ["experiments", "planned"], "aliases": [], "body": "Realistic system and errors: single-bus reduction of an area of RTS-GMLC ([[RTS-GMLC Area 1 data]] is already in the repo's `Data/`), many days, higher renewable shares, [[Calibration from historical forecasts]] and empirical error days (`forecasts.bootstrap_days` is a stub waiting for a DK1/DK2 price CSV); simplified multi-node version for congestion. A larger system also removes the exact ties that drive the small-case results ([[Regime analysis]]). Candidate addition: [[Renewable-driven forecast error]]. Target Feb 2027.\n\n## Figures and sources\n\n- [[thesis_report.pdf#page=64|Report §9.11]]"}, {"id": "Numerical verification", "folder": "Verification", "type": "data", "tags": ["verification", "data"], "aliases": [], "body": "Eight checks on Baldick's three published cases (base, w = 55, $\\bar s$ = 1200): all residuals **0 to machine precision** (largest 7e-12).\n\n| Check | Result |\n|---|---|\n| Same prices with bids (E) | [[
