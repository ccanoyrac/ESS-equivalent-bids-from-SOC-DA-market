Prop 5.1 KKT equivalence]] |\n| Optimal values differ by K | [[Prop 5.2 Lagrangian relaxation]] |\n| π rebuilt from prices only | [[Prop 6.13 Value of stored energy from prices]] |\n| Own problem = Baldick's battery block | [[Lemma 6.2 Decomposition]] |\n| Range of π: polyhedron = dual face | [[Prop 6.5 Polyhedron of equivalent bids]] |\n| Any admissible dual reproduces the outcome | [[Thm 6.3 Bids from technical data and prices]] |\n\nMulti-ESS check: [[Cor 6.15 Several ESS]] (5 batteries, 200 trials). Scripts: `verify_equivalence.py`, `verify_price_based.py`, `multi_ess.py` ([[Code base]]). Report ch. 8.\n\n## Figures and sources\n\n![[tab_verification.png]]\n*Report Table 8.1 — residual of each check*\n\n![[fig_check_outcome.png]]\n*Outcome checks on Baldick's three cases*\n\n![[slide_28.jpg]]\n*Defense slide 28: verification*\n\n- [[thesis_report.pdf#page=53|Report ch. 8]]"}, {"id": "Baldick base case", "folder": "Examples", "type": "example", "tags": ["example"], "aliases": ["base case"], "body": "One bus, six 4-hour intervals, cheap renewables, a 50 \\$/MWh thermal unit, one 800 MWh battery; α = 0.9, β = γ = 1, ε = ζ = 1 \\$/MWh, w = 40 \\$/MWh ([[Baldick 2026]]).\n\n| t | 1 | 2 | 3 | 4 | 5 | 6 |\n|---|---|---|---|---|---|---|\n| price λ* | 43.1 | 50 | 0 | 0 | 50 | 50 |\n| charge (MW) | 100 | 0 | 200 | 22.2 | 0 | 0 |\n| discharge (MW) | 0 | 90 | 0 | 0 | 175 | 25 |\n| SOC (MWh) | 360 | **0** | 720 | **800** | 100 | **0** |\n| π | 49 | 1.11 | 1.11 | 49 | 49 | 40 |\n| bid u | 43.1 | 0 | 0 | 0 | 43.1 | 35 |\n| offer c | 50 | 50 | 2.11 | 50 | 50 | 50 |\n\nSegments: A (t 1–2) buys part at 43.1, sells until empty → π = 49; B (t 3–4) buys at 0 until full → 1.11; C (t 5–6) sells at 50 until empty → 49 ([[Segments and marginal intervals]]). The price always sits on an edge of the bid band; bands are wide at t = 2, 4 (limits). Other published cases: w = 55, $\\bar s$ = 1200. Used in [[Numerical verification]], [[Pre-limit selection rule]].\n\n**Test system of the experiment code** (`cases.day_case`, stage 0): $SW^\\star$ = −19,449 \\$, $SW_{noESS}$ = −360,000 \\$, V = 340,551 \\$/day, dominated by avoided shedding (16–20h is 75 MW short without the battery). Split into two owners for [[Stage 1 two-battery case]]. Results: [[Stage 0 results]].\n\n## Figures and sources\n\n![[fig_base_dispatch.png]]\n*Optimal solution of Baldick's base case (report Figure 3.1)*\n\n![[fig_base_bid_bands.png]]\n*Equivalent bids in the base case*\n\n![[tab_pi_range.png]]\n*Report Table 3.1*\n\n![[repo_nb_capacity.png]]\n*Capacity against demand: without storage, 16–20h is 75 MW short*\n\n![[repo_nb_merit_order.png]]\n*Hour-by-hour merit order of the base case*\n\n- [[thesis_report.pdf#page=27|Report §3.5]]\n- [[thesis_report.pdf#page=39|Report §5.7 — worked example]]"}, {"id": "Five-hour segment example", "folder": "Examples", "type": "example", "tags": ["example", "intuition"], "aliases": [], "body": "Illustrative segment (γ = 1, α = 0.9, β = 1, wear 1, power 100 MW), prices 0, 10, 5, 50, 50. The battery starts and ends empty and can sell 200 MWh at 50, so it needs 222 MWh bought. It buys the cheapest hours first: 0 and 5 in full, only 22 MW at 10. That last MWh is marginal: $0.9\\pi-1=10\\Rightarrow\\pi=12.2$; buys below 10, sells above 13.2. Illustrates \"which price sets π\" ([[Segments and marginal intervals]]). In the [[Defense presentation]].\n\n## Figures and sources\n\n![[slide_25.jpg]]\n*Defense slide 25: which price sets π*"}, {"id": "Baldick 2026", "folder": "Literature", "type": "paper", "tags": ["literature", "core"], "aliases": [], "body": "**R. Baldick, “A state-of-charge based formulation for storage participation in electricity markets: Technical reference,” arXiv:2606.14993, 2026.**\n\nThe reference proposal: owners submit technical parameters and a terminal value; the ISO schedules the SOC. Source of the [[Baldick SOC-based design]] and the [[Baldick base case]] (three published cases). Author: [[Ross Baldick]]."}, {"id": "Chen and Baldick 2022", "folder": "Literature", "type": "paper", "tags": ["literature"], "aliases": [], "body": "**Y. Chen, R. Baldick, “Battery storage formulation and impact on day ahead security constrained unit commitment,” IEEE Trans. Power Syst., 37(5), 2022.**\n\nStorage in SCUC with SOC in the clearing (MISO context). Journal details to double-check before final citation. Related: [[Baldick SOC-based design]]."}, {"id": "Zheng et al. 2023 SOC market model", "folder": "Literature", "type": "paper", "tags": ["literature"], "aliases": [], "body": "**N. Zheng, X. Qin, D. Wu, G. Murtaugh, B. Xu, “Energy storage state-of-charge market model,” 2023.**\n\nSOC-dependent bidding in market clearing. Part of the [[Research gap]] table."}, {"id": "Chen and Tong 2022 SOC-dependent bids", "folder": "Literature", "type": "paper", "tags": ["literature"], "aliases": [], "body": "**C. Chen, L. Tong, “Wholesale market participation of storage with state-of-charge dependent bids,” 2022.**\n\nSOC-dependent bids. Part of the [[Research gap]] table."}, {"id": "Xu et al. 2018 cycle aging", "folder": "Literature", "type": "paper", "tags": ["literature"], "aliases": [], "body": "**B. Xu, J. Zhao, T. Zheng, E. Litvinov, D. S. Kirschen, “Factoring the cycle aging cost of batteries participating in electricity markets,” IEEE Trans. Power Syst., 2018.**\n\nOwner-side bidding with degradation. Related to the wear costs ε, ζ in [[Battery parameters (theta)]]."}, {"id": "Qi and Xu 2025 bid bounds", "folder": "Literature", "type": "paper", "tags": ["literature"], "aliases": [], "body": "**N. Qi, B. Xu, “Locational energy storage bid bounds for facilitating social welfare convergence,” IEEE Trans. Energy Markets, Policy and Regulation, 2025.**\n\nReference/bound bids for storage — close to [[RQ4 Use by the operator]] and [[CAISO default energy bids]]."}, {"id": "Martinez-Rico et al. 2020", "folder": "Literature", "type": "paper", "tags": ["literature", "forecast"], "aliases": [], "body": "**J. Martinez-Rico et al., “Forecast error sensitivity analysis for bidding in electricity markets with a hybrid renewable plant using a battery energy storage system,” Sustainability 12(9), 3577, 2020.**\n\nWind–solar plant + battery in the Iberian day-ahead and intraday markets. Perturbs **production** forecasts with a random walk (σ ∝ √horizon, 0–20% at 24 h); **prices assumed perfect** to isolate production error. Conclusion (uncertainty barely affects benefits) only covers production uncertainty; they note battery use is driven by the price spread. Useful to motivate the gap [[RQ3 Cost of imperfect information]] fills. See [[Renewable errors vs price errors]].\n\n## Figures and sources\n\n- [[forecast_error_models_note.pdf#page=2|Discussed in the forecast error note §1]]"}, {"id": "Lago et al. 2021", "folder": "Literature", "type": "paper", "tags": ["literature", "forecast"], "aliases": [], "body": "**J. Lago, G. Marcjasz, B. De Schutter, R. Weron, “Forecasting day-ahead electricity prices: A review of state-of-the-art algorithms, best practices and an open-access benchmark,” Applied Energy, 2021.**\n\nOpen `epftoolbox` benchmark (LEAR, DNN; Nord Pool, PJM, BE, FR, DE). Tool for [[Calibration from historical forecasts]]. Check volume/article number before citing."}, {"id": "Weron 2014", "folder": "Literature", "type": "paper", "tags": ["literature", "forecast"], "aliases": [], "body": "**R. Weron, “Electricity price forecasting: A review of the state-of-the-art with a look into the future,” Int. J. Forecasting 30(4), 1030–1081, 2014.**\n\nClassic review of price forecasting. Background for [[Synthetic forecast error model]]."}, {"id": "CAISO DMM 2024", "folder": "Literature", "type": "paper", "tags": ["literature", "monitoring"], "aliases": [], "body": "**CAISO Department of Market Monitoring, “Analysis of battery bid cost recovery and bid mitigation issues,” 2024.**\n\nStorage bid mitigation and [[CAISO default energy bids]]. Motivates [[RQ4 Use by the operator]]."}, {"id": "Potomac Economics 2025", "folder": "Literature", "type": "paper", "tags": ["literature", "motivation"], "aliases": [], "body": "**Potomac Economics, “2024 State of the Market Report for the ERCOT Electricity Markets,” 2025.**\n\n>10 GW of batteries in [[ERCOT]] by end 2024. Motivation statistic."}, {"id": "EIA 2025", "folder": "Literature", "type": "paper", "tags": ["literature", "motivation"], "aliases": [], "body": "**U.S. EIA, “U.S. battery capacity increased 66% in 2024,” 2025.**\n\n26 GW utility-scale batteries in the US end 2024, +66% in one year. Motivation statistic."}, {"id": "NEMO Committee 2026", "folder": "Literature", "type": "paper", "tags": ["literature", "motivation", "europe"], "aliases": [], "body": "**NEMO Committee, “Public consultation: storage orders in SDAC,” June 2026.**\n\nNew storage order in the European day-ahead coupling, expected Q4 2027 → [[European storage order (SDAC)]]."}, {"id": "Gabriel et al. 2013 Complementarity", "folder": "Literature", "type": "paper", "tags": ["literature", "method"], "aliases": [], "body": "**S. A. Gabriel, A. J. Conejo, J. D. Fuller, B. F. Hobbs, C. Ruiz, *Complementarity Modeling in Energy Markets*, Springer, 2013.**\n\nTextbook basis for the [[MCP formulation]]."}, {"id": "Schweppe et al. 1988 Spot pricing", "folder": "Literature", "type": "paper", "tags": ["literature", "method"], "aliases": [], "body": "**F. C. Schweppe, M. C. Caramanis, R. D. Tabors, R. E. Bohn, *Spot Pricing of Electricity*, 1988.**\n\nFoundations of marginal/nodal pricing behind [[LP market clearing]]."}, {"id": "Sioshansi et al. 2022 Storage modeling", "folder": "Literature", "type": "paper", "tags": ["literature"], "aliases": [], "body": "**R. Sioshansi, P. Denholm, J. Arteaga et al., “Energy-storage modeling: State-of-the-art and future research directions,” IEEE Trans. Power Syst., 2022.**\n\nReview of storage models in market clearing; background for [[State of charge]] modelling."}, {"id": "Jalal Kazempour", "folder": "People", "type": "person", "tags": ["people", "supervisor"], "aliases": [], "body": "Main supervisor (DTU). Holds that [[Baldick SOC-based design]] is better in social welfare than the current design. Proposed linking the work to CAISO's practice of the ISO forecasting prices to detect market power → [[RQ4 Use by the operator]]. Must approve the experiment design before [[Stage 1]]. The poster and paper are private between him and Carlos — not to be cited in university thesis documents."}, {"id": "Lukas Alfred Stippel", "folder": "People", "type": "person", "tags": ["people", "supervisor"], "aliases": [], "body": "Co-supervisor. Co-prepared the poster for an industry audience. Feedback style: slide titles as goal statements, maths made easy to follow, a \"What the symbols mean\" box on the poster. Prefers network in node pairs ([[Network in node pairs]])."}, {"id": "Ross Baldick", "folder": "People", "type": "person", "tags": ["people"], "aliases": [], "body": "Author of the SOC-based formulation ([[Baldick 2026]], [[Chen and Baldick 2022]]). UT Austin."}, {"id": "Thesis report", "folder": "Deliverables", "type": "deliverable", "tags": ["deliverable"], "aliases": [], "body": "Living thesis document (84 pages, LaTeX, formal paper style; working version of 1 Nov 2026). Chapters: 1 Introduction · 2 State of the art · 3 Market models · 4 MCP and equilibrium · 5 Equivalence · 6 Information/prices · 7 Computational burden · 8 Verification · 9 Experimental design ([[Experimental pipeline]]) · 10 First experiments ([[Stage 0 results]], [[Stage 1]]) · 11 Discussion and outlook · appendices (data, code in the GitHub repo, map to the technical note, work log) · nomenclature. Runs in parallel with the [[Technical note equivalence_full]]. Files: `thesis_report/` (main.tex, chapters, references.bib, make_figures.py, make_figures_experiments.py, which builds the experiment figures from the [[Code base]]).\n\n## Figures and sources\n\n![[fig_logic.png]]\n*Logic of the thesis (Figure 1.1)*\n\n- [[thesis_report.pdf|Open the thesis report]]"}, {"id": "Technical note equivalence_full", "folder": "Deliverables", "type": "deliverable", "tags": ["deliverable"], "aliases": [], "body": "The original technical note with the full derivations (constraint labels (A1)–(A12), (C1)–(C2)). The [[Thesis report]] follows its labels and has a map to it in the appendix."}, {"id": "Defense presentation", "folder": "Deliverables", "type": "deliverable", "tags": ["deliverable"], "aliases": [], "body": "\"Full thesis presentation\", kept updated as if for the defense. PowerPoint, DTU template, six parts: 1 Why storage bids matter (incl. [[Computational burden]]) · 2 Two ways to handle the SOC · 3 Same outcome? (π/ν first, then thresholds, (E), band example, catch) · 4 What must the battery know? (own problem, several batteries, segments, which price sets π, pre-limit, verification) · 5 What forecast errors cost · 6 Conclusions. Built with `build_defense.js`. Style praised by Carlos: visual explanations like the MCP slide and the RQ3 result slides.\n\n**To update:** part 5 (what forecast errors cost) still shows the results of the earlier 24-hour prototype; the current results are [[Stage 0 results]] and [[Stage 1]].\n\n## Figures and sources\n\n![[slide_02.jpg]]\n*Defense slide 2: the path through the talk*\n\n- [[ESS_thesis_defense.pdf|Open the defense presentation]]"}, {"id": "Poster (PES template)", "folder": "Deliverables", "type": "deliverable", "tags": ["deliverable"], "aliases": [], "body": "A1 poster in the PES hallway template (option 3, \"White Space\"): problem, gaps & RQs, model diagram (four bands: two designs → comparing → our results → use), case study ([[Baldick base case]] table), takeaways. Native PowerPoint shapes; also a .ppt version. Earlier version on a design canvas. Poster RQ numbering differs from the thesis (poster RQ1 = thesis RQ1+RQ2). Private with [[Jalal Kazempour]]; co-authors Jalal and [[Lukas Alfred Stippel]].\n\nLatest version (30 Oct 2026): Carlos made the layout more visual, and the case study now has an hour-by-hour chart next to the table (what the battery does, price against its bid and offer, energy stored, renewables and demand).\n\n## Figures and sources\n\n![[poster.jpg]]\n*Poster, PES template (A1)*\n\n- [[ESS_poster_PES.pdf|Open the poster PDF]]"}, {"id": "Lecture notes deck", "folder": "Deliverables", "type": "deliverable", "tags": ["deliverable"], "aliases": [], "body": "Slide deck explaining the theory step by step; titles rewritten as goal statements after [[Lukas Alfred Stippel]]'s feedback. The min{·} on slide 24 kept as is.\n\n## Figures and sources\n\n- [[ESS_lecture_notes.pdf|Open the lecture notes]]"}, {"id": "Forecast error note", "folder": "Deliverables", "type": "deliverable", "tags": ["deliverable", "forecast"], "aliases": [], "body": "9-page PDF note (Oct 2026): current [[Synthetic forecast error model]], the [[Renewable-driven forecast error]] proposal, complete pros and cons, recommendation (keep synthetic for stages 1–2, add renewable-driven family in stage 3), illustration of the stepped vs smooth supply curve. Cites [[Martinez-Rico et al. 2020]], [[Lago et al. 2021]], [[Weron 2014]].\n\n## Figures and sources\n\n- [[forecast_error_models_note.pdf|Open the forecast error note]]"}, {"id": "Experiments slash command", "folder": "Deliverables", "type": "deliverable", "tags": ["deliverable", "code"], "aliases": [], "body": "`experiments.md` (repo root): the Claude Code command that built the experiment package. Arguments: plan, status, stage0, stage1, stage2, calibration, figures. Rules: plan first and wait for OK, never edit the verified scripts, never invent data, never overwrite results, keep supervisor decisions configurable. Implements the [[Experimental pipeline]].\n\nWhere the code departs from it: the reference scripts it names are not in the repo, so `day_case` = [[Baldick base case]] and the gate checks the structure of the results; additions not in the spec — [[Price floor]], [[Throughput tie-breaker]], [[Common random numbers]], [[Terminal-value error]]; stage 1 redefined as two batteries ([[Stage 1]]); `plots.py`, `calibration.py` and stage 1/2 scripts not written yet."}, {"id": "Code base", "folder": "Deliverables", "type": "deliverable", "tags": ["deliverable", "code"], "aliases": ["repo", "GitHub"], "body": "GitHub repo **`ccanoyrac/ESS-equivalent-bids-from-SOC-DA-market`** (branch master), built with Claude Code.\n\n| Folder | What |\n|---|---|\n| `Code/src/` | `verify_equivalence.py`, `verify_price_based.py`, `numerical_check.py`, `computational_burden.py` (read-only, verified) |\n| `Code/src/experiments/` | `config`, `cases`, `benchmark`, `forecasts`, `bids`, `market`, `realtime`, `welfare`, `metrics`, `runner` ([[Experimental pipeline]]) |\n| `Code/scripts/` | `run_stage0_gate.py`, `make_stage1_figures.py`, `plot_multiplier_polyhedron.py` |\n| `Code/tests/` | 21 tests (forecasts, bids, market/real time, both gates) — all pass |\n| `Code/notebooks/` | `verify_equivalence.ipynb`, `stage0_experiments.ipynb` ([[Explorer and albums]]) |\n| `Code/docs/` | [[Model structure document]], [[Stage 1 structure document]], [[Regimes design document]], [[Bid curves proposal document]] + prototype |\n| `Data/` | [[RTS-GMLC Area 1 data]] |\n| `Archive/` | [[Earlier DP value-function approach]], Gurobi reproduction, original `ess_equivalence_code/` |\n| `Literature/` | [[Literature notes in the repo]] |\n| `Notes/`, `Presentations/` | theory overview; decks and poster |\n\nSolver: SciPy `linprog` (HiGHS); on Windows run with the `DTU_SYS` conda Python (the `.venv` SciPy is blocked by Application Control). `experiments.md` at the root is the [[Experiments slash command]]. Verified: [[Numerical verification]], [[Stage 0 verification]]."}, {"id": "ISO reference bids for market monitoring", "folder": "Ideas", "type": "idea", "tags": ["idea", "monitoring"], "aliases": [], "body": "The ISO evaluates the equivalent-bid map with its own forecast, $\\Phi_e(\\theta_e,\\hat\\lambda^{ISO})$, to get an SOC-consistent competitive reference for each battery, with a tolerance band from the polyhedron. Compare with [[CAISO default energy bids]] and strategic bid scenarios. Formalised as [[RQ4 Use by the operator]]."}, {"id": "Stochastic real-time extension", "folder": "Ideas", "type": "idea", "tags": ["idea", "future"], "aliases": [], "body": "Uncertainty **after** day-ahead clearing: actual renewables deviate from the gate-closure forecast → the real-time stage changes for both designs and Baldick's benchmark itself becomes stochastic; comparing designs needs scenarios and expected welfare. A continuation of the thesis, not part of RQ3. See [[Renewable errors vs price errors]]."}, {"id": "Strategic bidding extension", "folder": "Ideas", "type": "idea", "tags": ["idea", "future"], "aliases": [], "body": "Relax price-taking (E1): batteries anticipate their effect on prices; MCP/EPEC territory ([[MCP formulation]]). Decision gate G3, Jan 2027 ([[Timeline and milestones]]). Links to [[ISO reference bids for market monitoring]]."}, {"id": "Motivation", "folder": "Research", "type": "concept", "tags": ["motivation"], "aliases": [], "body": "Batteries are becoming price-setting resources, so the rules under which they bid shape prices and welfare.\n- 26 GW of US utility-scale batteries at end 2024, +66% in one year ([[EIA 2025]]).\n- >10 GW in [[ERCOT]] by end 2024 ([[Potomac Economics 2025]]); >17 GW in [[CAISO]] by mid-2026.\n- Europe plans a storage order in its day-ahead market for 2027 ([[European storage order (SDAC)]]).\n\nA battery's value depends on its [[State of charge]]: buy at midday, sell in the evening. The question is not whether batteries participate but **who carries the SOC**: the owner ([[Current design]]) or the market ([[Baldick SOC-based design]]). Adopting Baldick's design has costs ([[Why not adopt Baldick directly]]) → [[RQ1 Equivalence]].\n\n## Figures and sources\n\n- [[ESS_thesis_defense.pdf#page=4|Defense slide 4: storage statistics]]"}, {"id": "Open decisions for the supervisors", "folder": "Research", "type": "concept", "tags": ["research", "planning", "open"], "aliases": ["decisions", "meeting list"], "body": "Choices the code leaves open on purpose (the [[Experiments slash command]] says they must stay configurable until the supervisors agree). Useful as a meeting list.\n\n1. **Quantity rule with several batteries.** Keep the second block at \"all remaining power\", cap it by the battery's own SOC plan (recommended in the [[Stage 1 structure document]]: 2.0% loss instead of 38.1%), or give the case realistic power limits. See [[Quantity rule]], [[Bids cross between batteries]].\n2. **Real-time priority.** Should real time curtail a battery's charge before it sheds load? With one battery it never mattered; with two it causes shedding. See [[Real-time evaluation and premium psi]].\n3. **What \"stage 1\" is.** `config.py` still holds the one-battery 324-setting grid (σ × ρ × bias × rule × ψ, 500 draws); the [[Stage 1 structure document]] proposes two batteries with σ × σ_w × ω (72 settings, 150 draws). Pick one, or run both.\n4. **Scope of better bid curves.** Are ideas A–D a robustness check or a main result? Is idea E (SOC-dependent bids) a third design in scope? See [[Richer bid curves (ideas A-E)]], [[SOC-dependent bids]].\n5. **Test system.** The six-interval [[Baldick base case]] is full of exact ties and its storage value is mostly avoided load shedding. Add a non-reliability case, or move sooner to a larger, tie-free system ([[Stage 3]], [[RTS-GMLC Area 1 data]]).\n6. **Data that is missing.** Heterogeneous fleet data for [[Stage 2]] (`multi_ess.py` is not in the repo); a CSV of DK1/DK2 day-ahead prices for [[Calibration from historical forecasts]].\n7. **ψ values** {0, 10, 50} \\$/MWh, still marked \"to agree with the supervisors\".\n\n## Figures and sources\n\n- [[thesis_report.pdf#page=3|Report status page — open decisions]]"}, {"id": "Price floor", "folder": "Experiments", "type": "method", "tags": ["experiments", "forecast", "finding"], "aliases": ["floor"], "body": "The forecast is clipped from below: $\\hat\\lambda\\ge\\underline\\lambda=0$ (`ErrorModel.price_floor`, default 0). In the test system the cheapest supply is free, curtailable renewables, so prices cannot be negative and a forecaster would not predict them.\n\n**Why it matters.** In the free intervals (08–16h) the true price is exactly 0. Without the floor a negative forecast made the charge bid negative, the battery bought nothing, reached the 16–20h shortfall empty and 75 MW was shed at VOLL. That happened in about 1 draw in 5 at **every** σ (mean loss 25–32% of V, flat in σ), hiding the effect of σ. With the floor no stage-0 draw sheds load and the loss grows with σ ([[Stage 0 results]]).\n\nRare shedding remains possible when the floor clips several intervals to 0 at once: the battery becomes indifferent *when* to charge (a timing tie the [[Throughput tie-breaker]] cannot break). For a market with negative prices, set the floor to its minimum clearing price; `None` disables it. Part of the [[Synthetic forecast error model]].\n\n## Figures and sources\n\n- [[model_structure.pdf#page=13|Model structure §6.5 — price floor]]\n- [[model_structure.pdf#page=15|Model structure §7.3 — Finding 2]]\n- [[thesis_report.pdf#page=61|Report §9.6 — price floor]]"}, {"id": "Throughput tie-breaker", "folder": "Experiments", "type": "method", "tags": ["experiments", "method", "finding"], "aliases": ["tie-breaker", "kappa"], "body": "At $\\lambda^\\star$ the battery is indifferent between many plans (break-even round trip at 00–08h, free energy at 08–16h). The [[Self-schedule problem]] gets an extra term $-\\kappa\\,\\Delta T\\sum_t(p_t+g_t)$, $\\kappa=10^{-3}$ \\$/MWh (`BidRule.tie_break_reward`): among the plans optimal for the true profit it picks the one with the most throughput. κ is halved until the plan is still optimal for the true profit, so it never trades profit for activity; it never enters welfare.\n\nEffect: the zero-error loss ($\\mathcal B^{\\star p}$) falls from **6.32% to 1.30%** of V. It changed the plan in none of the 750 forecast draws: a forecast error breaks the ties by itself. The jump from 1.3% (σ = 0) to about 6% (σ = 1) is the cost of *near*-indifference. The 1.30% left is a timing tie (which free interval to charge in). Analysis of the 6.32%: [[Coordination loss at perfect prices]].\n\n## Figures and sources\n\n- [[model_structure.pdf#page=6|Model structure §4.3 — M3 with a tie-breaker]]\n- [[thesis_report.pdf#page=59|Report §9.4 — the owner's plan and a tie-breaker]]"}, {"id": "Common random numbers", "folder": "Experiments", "type": "method", "tags": ["experiments", "method"], "aliases": ["CRN", "seeds"], "body": "The seed of draw $d$ is `SeedSequence(base_seed, d)`: it depends on the draw only, not on the setting (before, `hash((base_seed, setting_id, d))` changed every session and gave each setting its own error shapes). So draw $d$ has the **same error shape $z$** in every setting; σ, bias, ρ, ω and the bid design only scale, shift or recombine it. The [[Terminal-value error]] has its own stream (`seed_w`).\n\nConsequences:\n- settings are compared draw by draw (`metrics.paired_difference`, which refuses pairs with different seeds); paired confidence intervals are 2.5–3× narrower;\n- in 99 of 150 stage-0 draws the loss is the same at every σ: the **shape** of the error decides the battery's plan, its size rarely does; σ = 1 and 2 give identical losses in every draw;\n- any single draw can be re-run alone in any session;\n- it is the basis of the transitions in [[Regime analysis]].\n\n## Figures and sources\n\n- [[model_structure.pdf#page=11|Model structure §5.2 — seeds]]\n- [[model_structure.pdf#page=19|Model structure §12 — paired comparison]]\n- [[thesis_report.pdf#page=61|Report §9.6 — seeds and common random numbers]]"}, {"id": "Terminal-value error", "folder": "Experiments", "type": "method", "tags": ["experiments", "forecast"], "aliases": ["w error", "sigma_w"], "body": "New in [[Stage 1]]: each owner estimates what its stored energy is worth at the end of the day,\n$$\\hat w_e=\\max\\big(0,\\ w_e+\\sigma_w z_{w,e}\\big),\\qquad z_{w,e}\\sim N(0,1)\\ \\text{iid}$$\none draw per battery and scenario, constant over the day, independent of the price error (`forecasts.terminal_values`, `ErrorModel.sigma_w`, own seed stream `seed_w`).\n\n- **Why.** $w$ is the owner's view of tomorrow; Baldick's design asks the owner to submit it ([[End-of-day value w]]). In the current design it never reaches the ISO, but it is the end point of the owner's self-schedule and fixes $\\pi_T$.\n- **Where it enters.** Only owner-built bids: $\\mathcal B^{fcst}$ uses $(\\hat\\lambda_e,\\hat w_e)$, $\\mathcal B^{priv}$ uses $\\hat w_e$. Benchmark and welfare keep the true $w_e$.\n- **Why it matters.** In the [[Stage 1 two-battery case]] the decisive value is 49 \\$/MWh: a battery with $w<49$ sells its energy before the end of the day, with $w>49$ it keeps it. At σ_w = 5 the chance of crossing 49 is 3.6% for A ($w=40$) and 11.5% for B ($w=55$).\n- Values proposed: σ_w ∈ {0, 2, 5, 10} \\$/MWh.\n\n## Figures and sources\n\n![[repo_s1_errors.png]]\n*The two errors on one draw (d = 0, σ = 5, ω = 0.5, σ_w = 5): ŵ_A = 38.2, ŵ_B = 52.8*\n\n- [[stage_1_structure.pdf#page=4|Stage 1 structure §5.2]]\n- [[thesis_report.pdf#page=61|Report §9.6.1]]"}, {"id": "Stage 0 results", "folder": "Experiments", "type": "data", "tags": ["experiments", "data", "result"], "aliases": [], "body": "[[Baldick base case]], one battery, price floor 0, tie-breaker on, prelimit rule, ψ = 10, ρ = 0, 150 draws, base seed 42 (`results/stage0/`). Benchmark: $SW^\\star$ = −19,449 \\$, $SW_{noESS}$ = −360,000 \\$, **V = 340,551 \\$/day**.\n\n| Setting | mean ΔSW (% of V) | 95% CI | median | p95 | undeliverable (MWh) |\n|---|---|---|---|---|---|\n| $\\mathcal B^\\star$ | 0.00 | | | | 0 |\n| $\\mathcal B^{\\star p}$ | 1.30 | | | | 40 |\n| $\\mathcal B^{fcst}$ σ = 1 \\$/MWh | 5.80 | 5.30–6.29 | 4.47 | 9.31 | 976 |\n| σ = 2 | 5.80 | 5.30–6.29 | 4.47 | 9.31 | 976 |\n| σ = 5 | 6.22 | 5.63–6.80 | 4.47 | 9.31 | 1,002 |\n| σ = 10 | 7.11 | 6.37–7.86 | 7.49 | 16.46 | 1,050 |\n| σ = 20 | 7.85 | 7.07–8.64 | 8.22 | 16.46 | 1,091 |\n| $\\mathcal B^{priv}$ ψ = 0 / 10 / 50 | 0.00 / 3.09 / 15.43 | | | | 1,051 |\n\nPaired steps ([[Common random numbers]]): σ 2→5 +0.42 points, 5→10 +0.90, 10→20 +0.74, all resolved. No draw sheds load. Losses take a few discrete values (2.8, 3.1, 4.5, 8.7, 9.3, 16.5%) because of near-ties: see [[Regime prototype results]].\n\nCaveats: V is dominated by reliability (without the battery 16–20h is 75 MW short, 300,000 \\$ of shedding), so % of V is small; $\\mathcal B^{priv}$ at ψ = 0 gives exactly 0 because both schedules are forced through the same SOC bound. Mechanisms: [[Price floor]], [[Throughput tie-breaker]].\n\n## Figures and sources\n\n![[repo_nb_stage0_sigma.png]]\n*Stage 0: welfare loss vs forecast error size (mean, median, p95)*\n\n![[repo_nb_benchmark.png]]\n*Baldick's benchmark on the base case (stage-0 notebook)*\n\n![[tab_stage0.png]]\n*Report Table 10.1 — stage 0 results*\n\n![[fig_stage0_loss.png]]\n*Report Figure 10.1 — loss against error size; losses of single draws*\n\n![[tab_s0_paired.png]]\n*Report Table 10.2 — paired differences*\n\n- [[model_structure.pdf#page=19|Model structure §12 — numbers]]\n- [[thesis_report.pdf#page=67|Report §10.3]]"}, {"id": "Coordination loss at perfect prices", "folder": "Experiments", "type": "result", "tags": ["experiments", "result", "finding"], "aliases": [], "body": "Why $\\mathcal B^{\\star p}$ (true prices, own plan) loses at all. Before the [[Throughput tie-breaker]] it lost 6.32% of V = 21,531 \\$: extra thermal +23,000 \\$, redispatch premium +2,800 \\$, degradation −269 \\$, 100 MWh left at the end −4,000 \\$.\n\n| | 00–04 | 04–08 | 08–12 | 12–16 | 16–20 | 20–24 |\n|---|---|---|---|---|---|---|\n| Baldick | buy 100 | **sell 90** | buy 200 | buy 22 | sell 175 | sell 25 |\n| own plan | – | – | – | buy 222 | sell 200 | – |\n| day-ahead | buy 100 | **sell 0** | – | buy 200 | sell 175 | – |\n\n**Diagnosis: an inter-temporal problem.** Buying at 00–04h and selling at 04–08h belong together (each alone is worth nothing; together they replace 90 MW of thermal). The hourly market resolves the two ties independently: the battery is the only bidder for the free surplus at 00–04h, and its offer at 50.01 loses to thermal at 50 at 04–08h. Baldick's clearing sees both hours and the SOC at once.\n\n**Finding 1 ([[Model structure document]] §7.2).** At $\\lambda^\\star$ the multiplier polyhedron is a square (only $\\pi_2,\\pi_4$ free in [1.11, 49]); all four corners — Baldick's dual and both selection rules — give the same schedule and the same loss. The loss comes from the quantity plan, not from bid prices; no price inside the polyhedron fixes it. Leads to [[Richer bid curves (ideas A-E)]] and [[SOC-dependent bids]]. Related: [[Remark 5.6 Quantity indeterminacy]].\n\n## Figures and sources\n\n![[repo_fig_poly_true.png]]\n*Π(λ*): a square of choices in (π₂, π₄); every corner gives the same schedule*\n\n- [[bid_curves_proposal.pdf#page=2|Bid curves proposal §1]]\n- [[model_structure.pdf#page=14|Model structure §7.2 — Finding 1]]\n- [[thesis_report.pdf#page=68|Report §10.4 — reading the results]]"}, {"id": "Bids cross between batteries", "folder": "Experiments", "type": "result", "tags": ["experiments", "result", "finding", "open"], "aliases": [], "body": "Zero-error check of the [[Stage 1 two-battery case]] with $\\mathcal B^{\\star p}$ (each owner bids from the true prices and its own plan).\n\nAt 20–24h A offers to sell at $c_A=41$ ($\\pi_A=w_A=40$ plus ζ) and B bids to buy at $u_B=43.1$. Because the [[Quantity rule]]'s second block offers all remaining power (up to 1,000 MW), the bids **cross**: the market clears A selling 1,000 MW and B buying 900 MW at 43.09 \\$/MWh. Neither can deliver: A is almost empty, B almost full. In real time A delivers 80 MW, B still charges 111 MW, and 31 MW of load is shed to serve that charge.\n\nResult: **38.1% of V lost**, 124 MWh shed, 6,976 MWh undeliverable (with one battery: 1.30%). One battery cannot trade with itself, so this is new with two owners. Capping the second block by each battery's own SOC plan brings the loss to 2.0% with no shedding. Is it a finding about the current design with independent owners, or an artefact of the bid rule? → [[Open decisions for the supervisors]].\n\n## Figures and sources\n\n![[repo_s1_zero_error.png]]\n*Zero-error check: the two batteries' bids cross at 20–24h*\n\n![[repo_s1_zero_error_rt.png]]\n*Real time after the crossing: 31 MW of load shed*\n\n![[tab_s1_rules.png]]\n*Report Table 10.4 — zero-error check under alternative quantity rules*\n\n- [[stage_1_structure.pdf#page=5|Stage 1 structure §6]]\n- [[thesis_report.pdf#page=71|Report §10.5.2]]"}, {"id": "Regime analysis", "folder": "Experiments", "type": "method", "tags": ["experiments", "method"], "aliases": ["regimes"], "body": "**Idea** ([[Regimes design document]]). Each draw ends in one of a few market outcomes, because the battery's day-ahead schedule only changes when the forecast crosses a threshold. A **regime** is the set of error shapes $z$ that give the same day-ahead schedule:\n$$\\mathcal R_k(\\theta)=\\{z:\\ x(z;\\theta)=x_k\\},\\qquad p_k(\\theta)=\\Pr(z\\in\\mathcal R_k)$$\nEverything after the day-ahead schedule is deterministic, so the loss is constant within a regime, and the mean decomposes **exactly**:\n$$\\mathbb E[\\Delta SW\\mid\\theta]=\\sum_k p_k(\\theta)L_k$$\nWith [[Common random numbers]], the change between two settings is the net flow of draws between regimes: $\\hat\\mu(\\theta')-\\hat\\mu(\\theta)=\\sum_{k,l}P_{kl}(L_l-L_k)$; draws that stay put contribute nothing.\n\nWhy cluster by outcome, not by $z$: the outcome is piecewise constant in $z$ (cells cut by straight threshold lines), so clustering $z$ would mix cells. Regimes are named by features (pattern C/D/–, free energy bought, infeasible intervals, undeliverable, shed, thermal at charging hours).\n\nAdds: a mechanism behind each mean, visible tails, \"how often\" probabilities (real frequencies once errors are calibrated, [[Stage 3]]). Larger systems need a coarse signature or k-medoids clustering. Status: prototype only ([[Regime prototype results]]); planned `regimes.py`, `plots.py`, `run_regimes.py`, `regimes.ipynb`, `test_regimes.py`.\n\n## Figures and sources\n\n![[repo_reg_map.png]]\n*Regimes on a 2-D slice of error space: straight threshold lines (σ = 5)*\n\n- [[regimes_design.pdf#page=2|Regimes design §1–3]]\n- [[thesis_report.pdf#page=69|Report §10.4 — losses take a few discrete values]]"}, {"id": "Regime prototype results", "folder": "Experiments", "type": "data", "tags": ["experiments", "data"], "aliases": [], "body": "`docs/prototypes/regimes_prototype.py`: [[Baldick base case]], $\\mathcal B^{fcst}$, prelimit, ψ = 10, floor 0, ρ = 0; 400 error shapes (seeds 0–399) reused for σ ∈ {0.5, 1, 2, 5, 10, 20} \\$/MWh. Exploratory.\n\nChecks: loss constant within every regime (spread 0.0); $\\sum_k\\hat p_kL_k$ equals the Monte Carlo mean (6.8132 = 6.8132 at σ = 5); 31 regimes in total.\n\n| | pattern | loss (% V) | p at σ=1 | σ=5 | σ=20 | mechanism |\n|---|---|---|---|---|---|---|\n| R1 | C-CCDD | 9.31 | 0.405 | 0.362 | 0.185 | keeps the morning charge, no 04–08h sale |\n| R2 | CDCCDD | 3.09 | 0.130 | 0.128 | 0.122 | benchmark-like cycle, oversells the evening |\n| R3 | C--CDD | 2.83 | 0.133 | 0.098 | 0.060 | charges in only one free interval |\n| R4 | C-CCDD | 8.70 | 0.087 | 0.077 | 0.045 | as R1, sells less at 16–20h |\n| R5 | C-CCDD | 16.46 | 0 | 0.052 | 0.223 | buys 200 MW from thermal at 00–04h |\n| R6 | C-CCD- | 4.47 | 0.068 | 0.062 | 0.035 | holds energy to the end |\n| R7 | CD-CDD | 2.36 | 0.045 | 0.040 | 0.028 | sells in the morning, one free interval |\n\nMean 6.26 → 6.81 → 8.86% at σ = 1, 5, 20. **How σ raises the loss:** R1 loses draws to R5. Between σ = 1 and 5, 88% of draws stay in their regime; the flow R1 → R5 (21 draws, +7.2 points each) gives +0.376 of the +0.558 rise. Crossing $z_1\\approx1.4$ (forecast ~7 \\$/MWh too high at 00–04h) moves a draw from R1 to R5. Feeds [[Stage 0 results]].\n\n## Figures and sources\n\n![[repo_reg_probabilities.png]]\n*Regime probabilities as σ grows*\n\n![[repo_reg_transitions.png]]\n*Where each draw goes from σ = 1 to σ = 5*\n\n- [[regimes_design.pdf#page=4|Regimes design §4 — prototype]]"}, {"id": "Explorer and albums", "folder": "Experiments", "type": "method", "tags": ["experiments", "tool"], "aliases": ["explorer", "albums"], "body": "Stage-0 notebook (`notebooks/stage0_experiments.ipynb`, 11 sections): §7 follows one draw end to end (bid from $\\hat\\lambda$ → two-block curve → hourly merit-order auctions → real-time repair → welfare). §7.7 **explorer**: pick seed, σ, ρ, bias, floor, rule and ψ; one draw is re-solved in ~0.03 s and eight panels redraw (forecast error · forecast, bid bands, prices · day-ahead dispatch · is the SOC feasible? · sold vs delivered · redispatch and shedding · real-time dispatch · where the loss comes from). §7.8 **albums**: one slider per parameter on a fixed error shape (seed 1036), saved as `album_seed1036.html` and GIFs for σ, bias, ρ, ψ, floor and rule. Shown in the [[Experiment design deck]]. Part of the [[Experimental pipeline]].\n\n## Figures and sources\n\n![[repo_nb_explorer.png]]\n*The explorer: one draw, eight panels*\n\n![[repo_nb_da_feasibility.png]]\n*Is the day-ahead SOC feasible?*\n\n- [[model_structure.pdf#page=18|Model structure §9]]"}, {"id": "Stage 1 two-battery case", "folder": "Examples", "type": "example", "tags": ["example", "stage1"], "aliases": ["two batteries", "A and B"], "body": "`cases.stage1_case(smax_each=400, w=(40, 55))`: the [[Baldick base case]] system with its 800 MWh battery split into two 400 MWh batteries that differ only in $w$ (s0 = 0, α = 0.9, β = γ = 1, ε = ζ = 1, power 1,000 MW).\n\n**Why 40 and 55:** the decisive value here is **49 \\$/MWh** — selling at 50 earns 50 − ζ = 49, and the morning round trip buys at 43.1 and needs (43.1 + ε)/α = 49. A battery with $w<49$ sells before the end of the day, with $w>49$ keeps its energy. A is 9 below, B 6 above.\n\n| | 00–04 | 04–08 | 08–12 | 12–16 | 16–20 | 20–24 |\n|---|---|---|---|---|---|---|\n| λ* | 43.1 | 50 | 0 | 0 | 50 | 50 |\n| A charge / discharge (MW) | 100 / – | – / 90 | 111 / – | – | – / 100 | – |\n| A SOC (MWh) | 360 | 0 | 400 | 400 | 0 | 0 |\n| B charge (MW) | – | – | – | 111 | – | – |\n| B SOC (MWh) | 0 | 0 | 0 | 400 | 400 | 400 |\n| π_A | 49 | 49 | 1.11 | 1.11 | 49 | 40 |\n| π_B | 49 | 1.11 | 1.11 | 55 | 55 | 55 |\n\nA is the trader (morning round trip, then fills on free energy and covers the 16–20h shortfall); B is the store (keeps 400 MWh worth 55 to it). Prices are the stage-0 prices. $SW^\\star$ = −17,048.89 \\$, V = 342,951.11 \\$: 2,400 \\$ more than stage 0 = 400 MWh × (55 − 49). Which battery charges when is not unique. Used in [[Stage 1]], [[Bids cross between batteries]], [[Terminal-value error]].\n\n## Figures and sources\n\n![[repo_s1_system.png]]\n*The stage-1 system: renewables, thermal and demand*\n\n![[repo_s1_benchmark.png]]\n*Baldick's result with batteries A and B*\n\n![[tab_s1_bench.png]]\n*Report Table 10.3 — benchmark with two ESS*\n\n- [[stage_1_structure.pdf#page=2|Stage 1 structure §3–4]]\n- [[thesis_report.pdf#page=70|Report §10.5.1]]"}, {"id": "RTS-GMLC Area 1 data", "folder": "Examples", "type": "example", "tags": ["example", "data"], "aliases": ["RTS-GMLC"], "body": "Data in the repo's `Data/` folder (from the earlier, archived direction — [[Earlier DP value-function approach]]): candidate base for [[Stage 3]] and for the [[Renewable-driven forecast error]].\n- `units.csv`: thermal fleet of RTS-GMLC Area 1 on one bus — nuclear 400 MW at 8.10 €/MWh, coal 1,119 MW at 25.58, CC gas 710 at 28.14, CT gas 385 at 50.35, CT oil 80 at 143.61, steam oil 24 at 179.46 (2,718 MW).\n- `timeseries_hourly_2020.csv`: 8,784 hours of load, wind (713.5 MW) and PV (404 MW), day-ahead and real-time. Load peak 2,850 MW; renewables 26.9% of load energy.\n- Facts: load DA/RT is a fixed 0.92 scaling, not an error (treat load as deterministic). Wind error std ≈ 184 MW (~26% of capacity), AR(1) ρ ≈ 0.87; PV ≈ 7.6% of capacity, ρ ≈ 0.73. The DA series are constructed (WWSIS-2), not real control-room forecasts, and wind looks pessimistic — say so in the thesis."}, {"id": "Richer bid curves (ideas A-E)", "folder": "Ideas", "type": "idea", "tags": ["idea", "bids"], "aliases": ["bid curves", "ideas A-E"], "body": "From the [[Bid curves proposal document]]. The ranges of valid π are information today's bid throws away. But the perfect-price loss is inter-temporal ([[Coordination loss at perfect prices]]), so curves inside the polyhedron cannot fix it; they may help against forecast error.\n\n| | Idea | How | vs ties | vs forecast error |\n|---|---|---|---|---|\n| A | range-spread curve | price steps across the valid π range | unlikely | little |\n| B | value-function curve | DP marginal value $v_t(s)$ around the planned SOC ([[Earlier DP value-function approach]]) | unlikely | little |\n| C | scenario curve | sample M forecasts from the owner's own error model, plan in each, sort (price, quantity) into a staircase | partly | **yes** |\n| D | stochastic value function | B averaged over C's scenarios | partly | **yes** |\n| E | [[SOC-dependent bids]] | the market tracks SOC; battery submits $v_t(s)$ | **yes** | with D: yes |\n\nA–D keep the [[Current design]] (they measure how much of the gap is naive bidding); E changes the design. Hypotheses: A, B leave the 6.32% at σ = 0; C, D reduce the loss under error; E removes most of the perfect-price loss. Each becomes a new bid family reusing `runner.evaluate_blocks`; E needs a multi-interval clearing that carries the SOC (not built; `verify_equivalence.build` has the SOC rows). Proposed order: common random numbers (done) → B at σ = 0 → C on the σ grid → E → regime analysis. See [[Open decisions for the supervisors]].\n\n## Figures and sources\n\n- [[bid_curves_proposal.pdf#page=3|Bid curves proposal §3–5]]"}, {"id": "SOC-dependent bids", "folder": "Ideas", "type": "idea", "tags": ["idea", "design"], "aliases": ["idea E", "third design"], "body": "Idea E of [[Richer bid curves (ideas A-E)]]: the battery submits its marginal value of energy as a function of SOC, $v_t(s)$, and the market tracks the SOC when clearing. The π ranges of the polyhedron are the jumps of $v_t$ at the planned SOC. It sits **between** the [[Current design]] (hourly MW curves, no SOC) and the [[Baldick SOC-based design]] (ISO optimises the SOC from technical data and $w$), close to where some operators are going ([[ERCOT]] NPRR 1186; [[Zheng et al. 2023 SOC market model]], [[Chen and Tong 2022 SOC-dependent bids]]; see also [[SOC-enforcing current design]]). Would make the thesis a comparison of three designs. Open: scope and which proposal to follow ([[Open decisions for the supervisors]]).\n\n## Figures and sources\n\n- [[bid_curves_proposal.pdf#page=2|Bid curves proposal §2 — what a curve can express]]"}, {"id": "Earlier DP value-function approach", "folder": "Ideas", "type": "idea", "tags": ["idea", "history"], "aliases": ["GUIDE.md", "DP approach"], "body": "The first plan for the experiments, now archived in the repo (`GUIDE.md`, `CLAUDE.md`, `Archive/guide_md_framework/`): real RTS-GMLC Area 1 data ([[RTS-GMLC Area 1 data]]), a dynamic programme for the owner's value function on an SOC grid (Δ = 10 MWh),\n$$\\pi^{offer}_t(s)=v_t(s)/\\beta+\\zeta,\\qquad \\pi^{bid}_t(s)=\\alpha v_t(s)-\\varepsilon$$\nuncertainty from AR(1) wind and PV errors scaled by $k$, and a sweep of renewable penetration. It asked whether the \"current design\" is European (no SOC) or CAISO (SOC enforced) — still open, see [[SOC-enforcing current design]]. Superseded by the bid-from-duals pipeline ([[Experimental pipeline]]); its DP and curve code may come back as idea B in [[Richer bid curves (ideas A-E)]]. Also archived: `baldick_soc_reproduction/` (Gurobi reproduction of Baldick's tables 2–4, multi-participant and multi-time cases)."}, {"id": "Model structure document", "folder": "Deliverables", "type": "deliverable", "tags": ["deliverable", "code"], "aliases": ["model_structure.pdf"], "body": "`Code/docs/model_structure.pdf` (21 pages): big picture, repository map, the `case` dictionary, models M1–M7, the forecast error and seeds, how to defend each error value, inside the multiplier polyhedron, one draw end to end, explorer and albums, configuration, verification, stage-0 numbers, notation crosswalk, caveats. Base of the [[Experiment design deck]]. Companion: [[Stage 1 structure document]].\n\n## Figures and sources\n\n- [[model_structure.pdf|Open the model structure document]]"}, {"id": "Stage 1 structure document", "folder": "Deliverables", "type": "deliverable", "tags": ["deliverable", "code"], "aliases": [], "body": "`Code/docs/stage_1_structure.pdf` (28 Oct 2026, 6 pages): the [[Stage 1 two-battery case]], Baldick's result on it, the two errors ([[Terminal-value error]]), the zero-error check where the bids cross ([[Bids cross between batteries]]), the decisions needed, proposed settings and notebook, and the code added. See [[Stage 1]].\n\n## Figures and sources\n\n- [[stage_1_structure.pdf|Open the stage 1 structure document]]"}, {"id": "Regimes design document", "folder": "Deliverables", "type": "deliverable", "tags": ["deliverable", "code"], "aliases": [], "body": "`Code/docs/regimes_design.pdf` (8 pages): the [[Regime analysis]] — idea, mathematics, prototype ([[Regime prototype results]]), how it plugs into the code, acceptance tests, limitations.\n\n## Figures and sources\n\n- [[regimes_design.pdf|Open the regimes design document]]"}, {"id": "Bid curves proposal document", "folder": "Deliverables", "type": "deliverable", "tags": ["deliverable", "idea"], "aliases": [], "body": "`Code/docs/bid_curves_proposal.pdf` (4 pages): where the loss at perfect prices comes from ([[Coordination loss at perfect prices]]), what a curve can and cannot express, five ideas ([[Richer bid curves (ideas A-E)]]), hypotheses and tests, questions for the supervisors. Written before the [[Throughput tie-breaker]], so it quotes 6.32%.\n\n## Figures and sources\n\n- [[bid_curves_proposal.pdf|Open the bid curves proposal]]"}, {"id": "Experiment design deck", "folder": "Deliverables", "type": "deliverable", "tags": ["deliverable"], "aliases": [], "body": "Brief deck on the experiments (DTU template, 12 slides): index, structure of one experiment, how a case is built, how forecast errors are implemented (with notation), why these error values, the four [[Bid families]], and the pipeline as final deliverable (explorer and albums for σ, bias and ρ). A longer 26-slide version also exists. Built from the [[Model structure document]]; covers stage 0, not yet [[Stage 1]].\n\n## Figures and sources\n\n- [[ESS_experiments_brief.pdf|Open the brief experiment deck (PDF)]]"}, {"id": "Literature notes in the repo", "folder": "Literature", "type": "paper", "tags": ["literature"], "aliases": [], "body": "Carlos's own Obsidian literature vault, `Literature/Thesis Literature/` in the [[Code base]] (index base file and a problem-statement canvas). Papers with notes:\n- A state-of-charge based formulation for storage → [[Baldick 2026]]\n- Battery storage formulation and impact on day-ahead SCUC → [[Chen and Baldick 2022]]\n- Energy storage state-of-charge market model → [[Zheng et al. 2023 SOC market model]]\n- Multi-interval energy-reserve co-optimization with SoC-dependent bids from battery storage → relevant to [[SOC-dependent bids]]\n- Electric storage participation in markets operated by RTOs and ISOs\n- A market mechanism for truthful bidding with energy storage\n- An efficient <script>
(function () {
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const FOLDERS = [["Home","home"],["Research","research"],["Market designs","market"],["Model","model"],["Results","results"],
    ["Computation","computation"],["Experiments","experiments"],["Verification","verification"],["Examples","examples"],
    ["Literature","literature"],["People","people"],["Deliverables","deliverables"],["Ideas","ideas"]];
  const fkey = Object.fromEntries(FOLDERS);
  const css = () => getComputedStyle(document.documentElement);
  const colorOf = (f) => css().getPropertyValue("--f-" + (fkey[f] || "literature")).trim();
  const byId = new Map(DATA.nodes.map((n) => [n.id, n]));
  const nbrs = new Map(DATA.nodes.map((n) => [n.id, new Set()]));
  DATA.links.forEach((l) => { nbrs.get(l.source).add(l.target); nbrs.get(l.target).add(l.source); });
  DATA.nodes.forEach((n) => { n.deg = nbrs.get(n.id).size; });
  document.getElementById("stats").textContent = `${DATA.nodes.length} notes · ${DATA.links.length} links · built from the Obsidian vault`;
  const slug = (s) => s.normalize("NFD").replace(/[^\w\s-]/g, "").trim().replace(/\s+/g, "-").replace(/_/g, "-").toLowerCase() || "note";
  const bySlug = new Map(DATA.nodes.map((n) => [slug(n.id), n.id]));

  // ---------------- state
  const st = { sel: "Home", hidden: new Set(), focus: false, labels: false, hist: [] };
  try { const h = JSON.parse(localStorage.getItem("atlas-ui") || "{}"); if (h.hidden) st.hidden = new Set(h.hidden); st.labels = !!h.labels; } catch (e) {}
  const save = () => { try { localStorage.setItem("atlas-ui", JSON.stringify({ hidden: [...st.hidden], labels: st.labels })); } catch (e) {} };

  // ---------------- filters
  const fbox = document.getElementById("filters");
  FOLDERS.forEach(([f]) => {
    const n = DATA.nodes.filter((d) => d.folder === f).length; if (!n) return;
    const b = document.createElement("button"); b.className = "chip"; b.dataset.f = f;
    b.innerHTML = `<span class="dot"></span>${f} <span class="n">${n}</span>`;
    b.setAttribute("aria-pressed", String(!st.hidden.has(f)));
    b.onclick = () => { st.hidden.has(f) ? st.hidden.delete(f) : st.hidden.add(f); b.setAttribute("aria-pressed", String(!st.hidden.has(f))); save(); restyle(); };
    fbox.appendChild(b);
  });
  const paintChips = () => fbox.querySelectorAll(".chip").forEach((b) => { b.querySelector(".dot").style.background = colorOf(b.dataset.f); });

  // ---------------- graph
  const svg = d3.select("#svg"), root = svg.append("g");
  const nodes = DATA.nodes.map((d) => ({ ...d })), links = DATA.links.map((l) => ({ ...l }));
  const FDEF = { repel: 420, dist: 70, center: 0.04, size: 1 };
  const F = { ...FDEF };
  try { Object.assign(F, JSON.parse(localStorage.getItem("atlas-forces") || "{}")); } catch (e) {}
  const r = (d) => F.size * (d.id === "Home" ? 13 : 4 + Math.sqrt(d.deg) * 1.9);
  const link = root.append("g").selectAll("line").data(links).join("line").attr("class", "link");
  const node = root.append("g").selectAll("g").data(nodes).join("g").attr("class", "node")
    .attr("tabindex", 0).attr("role", "button").attr("aria-label", (d) => d.id);
  node.append("circle").attr("r", r);
  node.append("text").attr("dy", (d) => -r(d) - 4).attr("text-anchor", "middle").text((d) => d.id);
  node.on("click", (e, d) => open(d.id)).on("keydown", (e, d) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(d.id); } })
    .on("mouseenter", (e, d) => hover(d.id)).on("mouseleave", () => hover(null));
  const sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id((d) => d.id).distance((l) => F.dist + 6 * Math.sqrt(Math.min(l.source.deg || 1, l.target.deg || 1))).strength(0.35))
    .force("charge", d3.forceManyBody().strength(-F.repel))
    .force("collide", d3.forceCollide().radius((d) => r(d) + 6))
    .force("x", d3.forceX().strength(F.center)).force("y", d3.forceY().strength(F.center * 1.25))
    .on("tick", () => {
      link.attr("x1", (d) => d.source.x).attr("y1", (d) => d.source.y).attr("x2", (d) => d.target.x).attr("y2", (d) => d.target.y);
      node.attr("transform", (d) => `translate(${d.x},${d.y})`);
    });
  node.call(d3.drag().on("start", (e, d) => { if (!e.active) sim.alphaTarget(0.2).restart(); d.fx = d.x; d.fy = d.y; })
    .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; }).on("end", (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));
  const zoom = d3.zoom().scaleExtent([0.2, 4]).on("zoom", (e) => { root.attr("transform", e.transform); zk = e.transform.k; restyleLabels(); });
  let zk = 1; svg.call(zoom);
  function fit(ids, ms = 600) {
    const el = document.getElementById("graph"); const W = el.clientWidth, H = el.clientHeight;
    const pts = nodes.filter((n) => (!ids || ids.has(n.id)) && visible(n));
    if (!pts.length || !W || !H) return;
    const x0 = d3.min(pts, (d) => d.x) - 40, x1 = d3.max(pts, (d) => d.x) + 40, y0 = d3.min(pts, (d) => d.y) - 40, y1 = d3.max(pts, (d) => d.y) + 40;
    const k = Math.min(2.2, 0.92 * Math.min(W / (x1 - x0), H / (y1 - y0)));
    svg.transition().duration(ms).call(zoom.transform, d3.zoomIdentity.translate(W / 2, H / 2).scale(k).translate(-(x0 + x1) / 2, -(y0 + y1) / 2));
  }
  for (let i = 0; i < 260; i++) sim.tick();
  sim.alpha(0.05).restart();

  // ---------------- forces panel (like Obsidian's graph settings)
  const FIN = { repel: ["f-repel", "o-repel", (v) => v.toFixed(0)], dist: ["f-dist", "o-dist", (v) => v.toFixed(0)],
                center: ["f-center", "o-center", (v) => v.toFixed(3)], size: ["f-size", "o-size", (v) => v.toFixed(2) + "×"] };
  function applyForces(reheat = true) {
    sim.force("charge").strength(-F.repel);
    sim.force("link").distance((l) => F.dist + 6 * Math.sqrt(Math.min(l.source.deg || 1, l.target.deg || 1)));
    sim.force("x").strength(F.center); sim.force("y").strength(F.center * 1.25);
    sim.force("collide").radius((d) => r(d) + 6);
    node.select("circle").attr("r", r); node.select("text").attr("dy", (d) => -r(d) - 4);
    Object.entries(FIN).forEach(([k, [i, o, fmt]]) => { document.getElementById(i).value = F[k]; document.getElementById(o).textContent = fmt(+F[k]); });
    try { localStorage.setItem("atlas-forces", JSON.stringify(F)); } catch (e) {}
    if (reheat) sim.alpha(0.5).restart();
  }
  Object.entries(FIN).forEach(([k, [i]]) => { document.getElementById(i).addEventListener("input", (e) => { F[k] = +e.target.value; applyForces(); }); });
  document.getElementById("f-reset").onclick = () => { Object.assign(F, FDEF); applyForces(); };
  const fpb = document.getElementById("ui-forces"), fpan = document.getElementById("ui-fpanel");
  fpb.onclick = () => { fpan.hidden = !fpan.hidden; fpb.setAttribute("aria-pressed", String(!fpan.hidden)); };
  applyForces(false);

  let hov = null;
  const visible = (d) => !st.hidden.has(d.folder) && (!st.focus || d.id === st.sel || nbrs.get(st.sel).has(d.id));
  function restyle() {
    node.attr("display", (d) => (visible(d) ? null : "none")).classed("sel", (d) => d.id === st.sel);
    node.select("circle").attr("fill", (d) => colorOf(d.folder));
    link.attr("display", (l) => (visible(l.source) && visible(l.target) ? null : "none"));
    paintChips(); restyleLabels(); hover(hov);
  }
  function restyleLabels() {
    const hot = hov || st.sel; const near = nbrs.get(hot) || new Set();
    node.select("text").attr("display", (d) => (st.labels || d.id === hot || near.has(d.id) || d.deg >= 17 || (zk > 1.5 && d.deg >= 8) || zk > 2.4 ? null : "none"));
  }
  function hover(id) {
    hov = id; const hot = id || st.sel; const near = nbrs.get(hot);
    node.classed("dim", (d) => !!id && d.id !== hot && !near.has(d.id));
    link.classed("hot", (l) => l.source.id === hot || l.target.id === hot).classed("dim", (l) => !!id && l.source.id !== hot && l.target.id !== hot);
    restyleLabels();
  }

  // ---------------- note rendering
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function render(md) {
    const math = [];
    md = md.replace(/\\\$/g, "@@D@@");
    md = md.replace(/\$\$([\s\S]+?)\$\$/g, (m, t) => `@@M${math.push("\\[" + t + "\\]") - 1}@@`)
           .replace(/\$([^$\n]+?)\$/g, (m, t) => `@@M${math.push("\\(" + t + "\\)") - 1}@@`)
           .replace(/!\[\[([^\]]+\.(?:png|jpe?g))\]\]\s*\n\*([^*\n]+)\*/g, (m, f, c) => `\n<figure><button class="zoom" data-img="${esc(f)}" data-cap="${esc(c)}" aria-label="Enlarge: ${esc(c)}"><img src="img/${esc(f)}" alt="${esc(c)}" loading="lazy"></button><figcaption>${esc(c)}</figcaption></figure>\n`)
           .replace(/\[\[([^\]#|]+\.pdf)(?:#page=(\d+))?(?:\|([^\]]+))?\]\]/g, (m, f, p, l) => `<a class="pdf" href="files/${esc(f)}${p ? "#page=" + p : ""}" data-pdf="${esc(f)}" data-page="${p || 1}" data-label="${esc(l || f)}"><span class="tag">PDF${p ? " p." + p : ""}</span>${esc(l || f)}</a>`)
           .replace(/\[\[([^\]|#]+)(?:\|([^\]]+))?\]\]/g, (m, t, a) => byId.has(t) ? `<a class="wl" href="#${slug(t)}" data-id="${esc(t)}">${esc(a || t)}</a>` : esc(a || t));
    let html = marked.parse(md, { mangle: false, headerIds: false });
    html = html.replace(/@@M(\d+)@@/g, (m, i) => esc(math[+i])).replace(/@@D@@/g, "$").replace(/<table>/g, '<div class="tablewrap"><table>').replace(/<\/table>/g, "</table></div>");
    return html;
  }
  const box = document.getElementById("note");
  function open(id, push = true) {
    if (!byId.has(id)) return;
    if (push && st.sel !== id) st.hist.push(st.sel);
    st.sel = id; const n = byId.get(id);
    const back = [...nbrs.get(id)].filter((x) => !new RegExp("\\[\\[" + id.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "[\\]|#]").test(n.body)).sort();
    const linksOut = [...nbrs.get(id)].sort();
    let body = n.body; if (!/^#\s/.test(body.trim())) body = `# ${id}\n\n` + body;
    box.innerHTML = `<div class="nav">${st.hist.length ? '<button class="tool" id="ui-back">← Back</button>' : ""}<button class="tool" id="ui-home">Home</button></div>
      <div class="meta"><span class="folder"><span class="dot" style="background:${colorOf(n.folder)}"></span>${esc(n.folder)}</span><span>· ${esc(n.type)}</span>${n.aliases.length ? `<span>· also: ${esc(n.aliases.join(", "))}</span>` : ""}</div>
      ${render(body)}
      <div class="backlinks"><h3>Connected notes (${linksOut.length})</h3><div>${linksOut.map((x) => `<button data-id="${esc(x)}"><span class="dot" style="background:${colorOf(byId.get(x).folder)};display:inline-block;margin-right:6px"></span>${esc(x)}</button>`).join("")}</div></div>`;
    box.querySelectorAll("[data-id]").forEach((a) => a.addEventListener("click", (e) => { e.preventDefault(); open(a.dataset.id); }));
    box.querySelectorAll("a.pdf").forEach((a) => a.addEventListener("click", (e) => { e.preventDefault(); openPdf(a.dataset.pdf, +a.dataset.page, a.dataset.label); }));
    box.querySelectorAll("button.zoom").forEach((b) => b.addEventListener("click", () => openImg(b.dataset.img, b.dataset.cap)));
    const b = document.getElementById("ui-back"); if (b) b.onclick = () => { const p = st.hist.pop(); if (p) open(p, false); };
    document.getElementById("ui-home").onclick = () => open("Home");
    if (getComputedStyle(box.parentElement).overflowY === "auto") box.parentElement.scrollTop = 0;
    if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([box]).catch(() => {});
    else (window.MathJax.startup = window.MathJax.startup || {}).pageReady = () => MathJax.typesetPromise([box]);
    try { history.replaceState(null, "", "#" + slug(id)); } catch (e) {}
    restyle();
    if (st.focus) fit(new Set([id, ...nbrs.get(id)]));
  }


  // ---------------- viewer for images and PDFs (published alongside the page)
  const modal = document.getElementById("ui-modal"), view = document.getElementById("ui-view"), mtitle = document.getElementById("ui-mtitle");
  const pdfctl = document.getElementById("ui-pdfctl"), pnum = document.getElementById("ui-pnum"), pcount = document.getElementById("ui-pcount");
  const pv = { doc: null, file: null, page: 1, zoom: 1, task: null, last: null };
  const docs = new Map();
  function showModal(title) { mtitle.textContent = title; modal.hidden = false; pv.last = document.activeElement; document.getElementById("ui-close").focus(); }
  function closeModal() { modal.hidden = true; view.innerHTML = ""; if (pv.last) pv.last.focus(); }
  function openImg(f, cap) {
    pdfctl.hidden = true; showModal(cap);
    view.innerHTML = `<img src="img/${esc(f)}" alt="${esc(cap)}">`;
  }
  async function openPdf(f, page, label) {
    pdfctl.hidden = false; showModal(label);
    document.getElementById("ui-newtab").href = `files/${f}#page=${page}`;
    view.innerHTML = '<div class="msg">Loading the PDF…</div>';
    try {
      if (!window.pdfjsLib) throw new Error("viewer library not loaded");
      if (!docs.has(f)) docs.set(f, pdfjsLib.getDocument({ url: "files/" + f }).promise);
      pv.doc = await docs.get(f); pv.file = f; pv.zoom = 1;
      pcount.textContent = "of " + pv.doc.numPages; pnum.max = pv.doc.numPages;
      await drawPage(Math.min(Math.max(1, page), pv.doc.numPages));
    } catch (e) {
      docs.delete(f);
      view.innerHTML = `<div class="msg">The PDF could not be shown here. Use “Open in new tab”, or open ${esc(f)} from the vault’s Files folder.</div>`;
    }
  }
  async function drawPage(n) {
    if (!pv.doc) return;
    pv.page = n; pnum.value = n;
    const page = await pv.doc.getPage(n);
    const base = page.getViewport({ scale: 1 });
    const fitW = Math.max(280, view.clientWidth - 32) / base.width;
    const scale = fitW * pv.zoom, dpr = window.devicePixelRatio || 1;
    const vp = page.getViewport({ scale: scale * dpr });
    const c = document.createElement("canvas"); c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
    c.style.width = Math.floor(vp.width / dpr) + "px"; c.style.height = Math.floor(vp.height / dpr) + "px";
    c.setAttribute("aria-label", `${pv.file}, page ${n}`);
    if (pv.task) { try { pv.task.cancel(); } catch (e) {} }
    pv.task = page.render({ canvasContext: c.getContext("2d"), viewport: vp });
    try { await pv.task.promise; } catch (e) { return; }
    view.innerHTML = ""; view.appendChild(c); view.scrollTop = 0;
    document.getElementById("ui-newtab").href = `files/${pv.file}#page=${n}`;
  }
  document.getElementById("ui-close").onclick = closeModal;
  document.getElementById("ui-prev").onclick = () => pv.doc && pv.page > 1 && drawPage(pv.page - 1);
  document.getElementById("ui-next").onclick = () => pv.doc && pv.page < pv.doc.numPages && drawPage(pv.page + 1);
  document.getElementById("ui-zin").onclick = () => { pv.zoom = Math.min(3, pv.zoom * 1.25); drawPage(pv.page); };
  document.getElementById("ui-zout").onclick = () => { pv.zoom = Math.max(0.5, pv.zoom / 1.25); drawPage(pv.page); };
  pnum.addEventListener("change", () => { const n = Math.round(+pnum.value); if (pv.doc && n >= 1 && n <= pv.doc.numPages) drawPage(n); });
  document.addEventListener("keydown", (e) => {
    if (modal.hidden) return;
    if (e.key === "Escape") closeModal();
    if (!pdfctl.hidden && e.target !== pnum) { if (e.key === "ArrowRight") document.getElementById("ui-next").click(); if (e.key === "ArrowLeft") document.getElementById("ui-prev").click(); }
  });
  // ---------------- search
  const q = document.getElementById("q"), res = document.getElementById("results"); let hits = [], cur = 0;
  function search() {
    const s = q.value.trim().toLowerCase(); if (!s) { res.hidden = true; return; }
    hits = DATA.nodes.map((n) => {
      const t = n.id.toLowerCase(), al = n.aliases.join(" ").toLowerCase(), b = n.body.toLowerCase();
      const score = t.startsWith(s) ? 4 : t.includes(s) ? 3 : al.includes(s) ? 2 : b.includes(s) ? 1 : 0;
      return [score, n];
    }).filter((x) => x[0]).sort((a, b) => b[0] - a[0] || b[1].deg - a[1].deg).slice(0, 12).map((x) => x[1]);
    cur = 0;
    res.innerHTML = hits.length ? hits.map((n, i) => `<button role="option" aria-selected="${i === 0}" data-id="${esc(n.id)}"><span class="dot" style="background:${colorOf(n.folder)}"></span>${esc(n.id)}</button>`).join("")
      : `<div style="padding:10px 12px;color:var(--muted)">No note matches “${esc(q.value)}”.</div>`;
    res.hidden = false;
    res.querySelectorAll("button").forEach((b) => b.onclick = () => pick(b.dataset.id));
  }
  function pick(id) { res.hidden = true; q.value = ""; open(id); fit(new Set([id, ...nbrs.get(id)])); }
  q.addEventListener("input", search);
  q.addEventListener("keydown", (e) => {
    const bs = res.querySelectorAll("button"); if (res.hidden || !bs.length) return;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); cur = (cur + (e.key === "ArrowDown" ? 1 : bs.length - 1)) % bs.length; bs.forEach((b, i) => b.setAttribute("aria-selected", String(i === cur))); bs[cur].scrollIntoView({ block: "nearest" }); }
    if (e.key === "Enter") { e.preventDefault(); pick(hits[cur].id); }
    if (e.key === "Escape") { res.hidden = true; }
  });
  document.addEventListener("click", (e) => { if (!e.target.closest(".search")) res.hidden = true; });

  // ---------------- tools
  const fb = document.getElementById("ui-focus"), lb = document.getElementById("ui-labels");
  fb.onclick = () => { st.focus = !st.focus; fb.setAttribute("aria-pressed", String(st.focus)); restyle(); fit(st.focus ? new Set([st.sel, ...nbrs.get(st.sel)]) : null); };
  lb.setAttribute("aria-pressed", String(st.labels));
  lb.onclick = () => { st.labels = !st.labels; lb.setAttribute("aria-pressed", String(st.labels)); save(); restyleLabels(); };
  document.getElementById("ui-fit").onclick = () => fit(st.focus ? new Set([st.sel, ...nbrs.get(st.sel)]) : null);
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", restyle);
  new MutationObserver(restyle).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  window.addEventListener("hashchange", () => { const id = bySlug.get(location.hash.slice(1)); if (id && id !== st.sel) open(id); });
  window.addEventListener("resize", () => fit(null, 0));

  const start = bySlug.get((location.hash || "").slice(1)) || "Home";
  open(start, false);
  requestAnimationFrame(() => fit(null, 0));
})();
</script>

</body></html>
